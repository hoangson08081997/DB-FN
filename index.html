    window.encryptVaultAsync = function (plainStr, secret) {
      if (!window.Worker) return Promise.resolve(CryptoJS.AES.encrypt(plainStr, secret).toString());
      if (!window._cryptoWorker) {
        const code = `
          importScripts('https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js');
          self.onmessage = function(e) {
            const { id, plainStr, secret } = e.data;
            try { self.postMessage({ id, cipher: CryptoJS.AES.encrypt(plainStr, secret).toString() }); }
            catch (err) { self.postMessage({ id, error: err.message }); }
          };
        `;
        window._cryptoWorker = new Worker(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
        window._cryptoMap = {};
        window._cryptoWorker.onmessage = function (e) {
          const { id, cipher, error } = e.data;
          if (window._cryptoMap[id]) {
            error ? window._cryptoMap[id].reject(new Error(error)) : window._cryptoMap[id].resolve(cipher);
            delete window._cryptoMap[id];
          }
        };
      }
      return new Promise((resolve, reject) => {
        const id = Math.random().toString(36).slice(2);
        window._cryptoMap[id] = { resolve, reject };
        window._cryptoWorker.postMessage({ id, plainStr, secret });
      });
    };

const trim2 = (x) => String(Math.round(x * 100) / 100).replace('.', ',');
const fixed2 = (x) => x.toFixed(2).replace('.', ',');
const compact = (n) => {

  if (a >= 1e6) return s + trim2(a / 1e6) + 'tr';

function normalizeData(raw) {
  const base = makeDefaultData();
  if (!raw || typeof raw !== 'object') return base;
  const src = (raw.original || raw.demo) ? (raw[raw.mode] || raw.demo || raw.original) : raw;
  const out = { ...base, ...src };
  out.targets = { ...base.targets, ...(src.targets || {}) };
  CLASSES.forEach((c) => { out.targets[c.key] = num(out.targets[c.key]); });
  ['cash', 'receivable', 'estate', 'income', 'budget', 'fireTarget'].forEach((k) => { out[k] = num(out[k]); });
  out.estateName = String(out.estateName || '');
  const rd = src.debts && typeof src.debts === 'object' ? src.debts : (src.liabilities ? { safe: src.liabilities } : base.debts);
  out.debts = { risk: num(rd.risk), safe: num(rd.safe), fixed: num(rd.fixed) };
  const list = (k) => (Array.isArray(src[k]) ? src[k] : base[k]);
  out.stocks = list('stocks').map((r) => ({ id: r.id || uid(), code: String(r.code || ''), qty: num(r.qty), cost: num(r.cost), price: num(r.price), target: num(r.target), dir: num(r.dir), _owner: r._owner, _ownerName: r._ownerName }));
  out.gold = list('gold').map((r) => ({ id: r.id || uid(), type: String(r.type || ''), qty: num(r.qty), cost: num(r.cost), price: num(r.price), target: num(r.target), _owner: r._owner, _ownerName: r._ownerName }));
  out.savings = list('savings').map((r) => ({ id: r.id || uid(), bank: String(r.bank || ''), principal: num(r.principal), rate: num(r.rate), term: num(r.term), start: typeof r.start === 'string' && r.start ? r.start : toISO(TODAY), _owner: r._owner, _ownerName: r._ownerName }));
  out.categories = list('categories').map((r, i) => ({
    id: r.id || uid(), name: String(r.name || ''), color: r.color || CAT_COLORS[i % CAT_COLORS.length], amount: num(r.amount), _owner: r._owner, _ownerName: r._ownerName,
    items: (Array.isArray(r.items) ? r.items : []).map((it) => ({ id: it.id || uid(), name: String(it.name || ''), amount: num(it.amount) })),
  }));
  out.goals = list('goals').map((r) => ({
    id: r.id || uid(), name: String(r.name || ''), current: num(r.current), target: num(r.target),
    deadline: typeof r.deadline === 'string' && r.deadline ? r.deadline : toISO(addMonths(TODAY, 12)),
    source: GOAL_SOURCES.some((s) => s.key === r.source) ? r.source : 'bank',
    priority: [1, 2, 3].includes(num(r.priority)) ? num(r.priority) : 2,
    _owner: r._owner, _ownerName: r._ownerName,
  }));
  out.recMode = src.recMode === 'monthly' ? 'monthly' : 'rebalance';
  return out;
}

function mergeCoupleData(u1Data, u2Data, u1Name, u2Name, u1Email, u2Email) {
  const d1 = normalizeData(u1Data), d2 = normalizeData(u2Data);
  const tag1 = (arr) => arr.map((x) => ({ ...x, _owner: u1Email, _ownerName: u1Name }));
  const tag2 = (arr) => arr.map((x) => ({ ...x, _owner: u2Email, _ownerName: u2Name }));
  return {
    cash: d1.cash + d2.cash, receivable: d1.receivable + d2.receivable, estate: d1.estate + d2.estate,
    estateName: [d1.estateName, d2.estateName].filter(Boolean).join(' + ') || 'BĐS Gia đình',
    debts: { risk: d1.debts.risk + d2.debts.risk, safe: d1.debts.safe + d2.debts.safe, fixed: d1.debts.fixed + d2.debts.fixed },
    targets: { ...d1.targets },
    stocks: [...tag1(d1.stocks), ...tag2(d2.stocks)],
    gold: [...tag1(d1.gold), ...tag2(d2.gold)],
    savings: [...tag1(d1.savings), ...tag2(d2.savings)],
    income: d1.income + d2.income, budget: d1.budget + d2.budget, fireTarget: d1.fireTarget + d2.fireTarget,
    categories: [
      ...d1.categories.map((c) => ({ ...c, name: `${c.name} (${u1Name})`, _owner: u1Email, _ownerName: u1Name })),
      ...d2.categories.map((c) => ({ ...c, name: `${c.name} (${u2Name})`, _owner: u2Email, _ownerName: u2Name })),
    ],
    goals: [
      ...d1.goals.map((g) => ({ ...g, name: `${g.name} [${u1Name}]`, _owner: u1Email, _ownerName: u1Name })),
      ...d2.goals.map((g) => ({ ...g, name: `${g.name} [${u2Name}]`, _owner: u2Email, _ownerName: u2Name })),
    ],
    recMode: d1.recMode,
  };
}

const catTotal = (c) => (c.items.length ? sum(c.items, (i) => i.amount) : num(c.amount));

function compute(d) {
  const stockTotal = sum(d.stocks, (r) => r.qty * r.price);
  const goldTotal = sum(d.gold, (r) => r.qty * r.price);
  const bankTotal = sum(d.savings, (r) => r.principal);
  const actual = { stock: stockTotal, gold: goldTotal, bank: bankTotal, cash: d.cash, recv: d.receivable, estate: d.estate };
  const total = sum(CLASSES, (c) => actual[c.key]);
  const debt = d.debts.risk + d.debts.safe + d.debts.fixed;
  const pct = {};
  CLASSES.forEach((c) => { pct[c.key] = total > 0 ? (actual[c.key] / total) * 100 : 0; });
  const spent = sum(d.categories, catTotal);
  const net = total - debt;
  const fireTarget = d.fireTarget > 0 ? d.fireTarget : spent * 12 * 25;
  return {
    stockTotal, goldTotal, bankTotal, actual, total, debt, net, pct, spent, fireTarget,
    surplus: d.income - spent,
    firePct: fireTarget > 0 ? Math.max(0, (net / fireTarget) * 100) : 0,
    targetSum: sum(CLASSES, (c) => d.targets[c.key])
  };
}

function projectGoal(g, surplus) {
  const rem = Math.max(0, g.target - g.current), daysLeft = daysBetween(TODAY, parseISO(g.deadline));
  if (g.target > 0 && rem === 0) return { kind: 'done', line: 'Đã đủ số tiền mục tiêu', rem };
  if (g.target <= 0) return { kind: 'none', line: 'Nhập số tiền mục tiêu để xem dự phóng', rem };
  if (surplus <= 0) return { kind: 'bad', line: 'Thặng dư ≤ 0, chưa thể tích lũy thêm', rem };
  const months = Math.ceil(rem / surplus), line = `Nếu dồn 100% thặng dư (${compact(surplus)}/th), cần ${months} tháng`;
  if (daysLeft < 0) return { kind: 'bad', line, verdict: `Đã quá hạn ${Math.abs(daysLeft)} ngày`, rem };
  const monthsLeft = daysLeft / 30.4375;
  if (months <= monthsLeft) return { kind: 'ok', line, verdict: `Kịp hạn, dư ~${Math.max(0, Math.floor(monthsLeft - months))} tháng`, rem };
  return { kind: 'bad', line, verdict: `Không kịp hạn, trễ ~${Math.round(months - monthsLeft)} tháng. Cần ${compact(rem / Math.max(1, Math.floor(monthsLeft)))}/tháng`, rem };
}

const GoalsCard = memo(function GoalsCard({ data, setData, c }) {
  const [editId, setEditId] = useState(null);
  const upd = (id, patch) => setData((d) => ({ ...d, goals: d.goals.map((g) => (g.id === id ? { ...g, ...patch } : g)) }));
  const del = (id) => setData((d) => ({ ...d, goals: d.goals.filter((g) => g.id !== id) }));
  const add = (preset = null) => {
    const id = uid();
    const newGoal = preset || { id, name: 'Mục tiêu mới', current: 0, target: 50000000, deadline: toISO(addMonths(TODAY, 12)), source: 'bank', priority: 2 };
    setData((d) => ({ ...d, goals: [...d.goals, { ...newGoal, id }] }));
    if (!preset) setEditId(id);
  };

  const poolAvail = { bank: c.bankTotal, cash: data.cash, gold: c.goldTotal, stock: c.stockTotal };
  const poolStats = {}, goalAllocStatus = {};

  ['bank', 'cash', 'gold', 'stock'].forEach((srcKey) => {
    const avail = poolAvail[srcKey] || 0;
    const goalsInSrc = data.goals
      .filter((g) => (g.source || 'bank') === srcKey)
      .slice()
      .sort((a, b) => (a.priority || 2) - (b.priority || 2) || daysBetween(TODAY, parseISO(a.deadline)) - daysBetween(TODAY, parseISO(b.deadline)));

    const totalUsed = sum(goalsInSrc, (g) => g.current), balance = avail - totalUsed;
    let remPool = avail;

    goalsInSrc.forEach((g) => {
      const covered = Math.max(0, Math.min(g.current, remPool)), uncovered = Math.max(0, g.current - covered);
      remPool = Math.max(0, remPool - g.current);
      goalAllocStatus[g.id] = { covered, uncovered, avail, totalUsed, balance };
    });

    poolStats[srcKey] = { key: srcKey, label: GOAL_SOURCES.find((s) => s.key === srcKey).label, avail, totalUsed, balance, count: goalsInSrc.length, goalsInSrc };
  });

  const overdrawnPools = Object.values(poolStats).filter((p) => p.balance < 0);
  const suggestions = [];
  const emergencyTarget = c.spent > 0 ? c.spent * 6 : 42000000;
  const hasEmergencyGoal = data.goals.some((g) => /khẩn cấp|dự phòng/i.test(g.name));

  if (!hasEmergencyGoal) {
    suggestions.push({
      id: 'sug-emg', tone: 'amber',
      text: `Bạn chưa có Quỹ khẩn cấp (chuẩn 6 tháng chi tiêu = ${compact(emergencyTarget)}). Nên ưu tiên số 1 từ Tiền gửi NH để bảo vệ tài sản.`,
      actionLabel: '+ Tạo Quỹ khẩn cấp',
      onAction: () => add({ name: 'Quỹ khẩn cấp 6 tháng', current: Math.min(c.bankTotal, emergencyTarget), target: emergencyTarget, deadline: toISO(addMonths(TODAY, 6)), source: 'bank', priority: 1 })
    });
  }

  overdrawnPools.forEach((p) => {
    const lowPrioGoals = p.goalsInSrc.filter((g) => goalAllocStatus[g.id]?.uncovered > 0);
    const names = lowPrioGoals.map((g) => `“${g.name}” (Ưu tiên ${g.priority || 2})`).join(', ');
    suggestions.push({
      id: `sug-over-${p.key}`, tone: 'rose',
      text: `Nguồn ${p.label} đang chỉ có ${compact(p.avail)} nhưng bạn phân bổ tới ${compact(p.totalUsed)} (Đang âm ${compact(Math.abs(p.balance))}). Khuyến nghị: Giảm số tiền hiện có hoặc lùi độ ưu tiên của ${names || 'mục tiêu phụ'}.`
    });
  });

  const activeGoals = data.goals.filter((g) => g.target > g.current).slice().sort((a, b) => (a.priority || 2) - (b.priority || 2) || daysBetween(TODAY, parseISO(a.deadline)) - daysBetween(TODAY, parseISO(b.deadline)));

  if (c.surplus > 0 && activeGoals.length > 0) {
    const topG = activeGoals[0], rem = topG.target - topG.current, mNeed = Math.ceil(rem / c.surplus);
    suggestions.push({
      id: 'sug-surplus', tone: 'indigo',
      text: `Gợi ý ưu tiên thặng dư (+${compact(c.surplus)}/tháng): Nên dồn trước cho “${topG.name}” (Ưu tiên ${topG.priority || 2}, còn thiếu ${compact(rem)}). Chỉ mất khoảng ${mNeed} tháng để hoàn thành dứt điểm.`
    });
  } else if (c.surplus <= 0 && activeGoals.length > 0) {
    suggestions.push({
      id: 'sug-nosurplus', tone: 'amber',
      text: `Thặng dư tháng đang ≤ 0 (${compact(c.surplus)}). Bạn cần cắt giảm chi tiêu hoặc tăng thu nhập để có dòng tiền nuôi ${activeGoals.length} mục tiêu đang chạy.`
    });
  }

  const freeBank = Math.max(0, poolStats.bank.balance), freeCash = Math.max(0, poolStats.cash.balance);
  if ((freeBank + freeCash) >= 10000000 && activeGoals.length > 0) {
    const topG = activeGoals[0];
    suggestions.push({
      id: 'sug-idle', tone: 'emerald',
      text: `Bạn đang còn ${compact(freeBank + freeCash)} vốn thanh khoản chưa gán mục tiêu (${compact(freeBank)} Tiền gửi NH, ${compact(freeCash)} Tiền mặt). Có thể phân bổ thêm vào “${topG.name}” để rút ngắn thời gian.`
    });
  }

  return (
    <Card title="Tiến độ mục tiêu & Phân bổ nguồn tiền" right={<IconBtn icon="plus" label="Thêm mục tiêu" onClick={() => add()} />}>
      <div className="mb-3 rounded-xl border border-slate-200 bg-slate-50 p-2.5">
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500">Kiểm tra nguồn vốn cấp cho mục tiêu</span>
          <span className="text-[10px] font-semibold text-slate-400">Đã gán / Thực có</span>
        </div>
        <div className="grid grid-cols-2 gap-1.5">
          {['bank', 'cash', 'gold', 'stock'].map((k) => {
            const st = poolStats[k];
            if (st.avail === 0 && st.totalUsed === 0) return null;
            const isOver = st.balance < 0;
            return (
              <div key={k} className={`rounded-lg border px-2 py-1.5 text-xs ${isOver ? 'bg-rose-50 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-700'}`}>
                <div className="flex items-center justify-between font-bold">
                  <span className="truncate">{st.label}</span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${isOver ? 'bg-rose-600 text-white' : 'bg-emerald-50 text-emerald-700'}`}>
                    {isOver ? `Âm ${compact(Math.abs(st.balance))}` : `Dư ${compact(st.balance)}`}
                  </span>
                </div>
                <div className="text-[11px] tnum mt-0.5 text-slate-500">
                  Dùng <b className={isOver ? 'text-rose-700' : 'text-slate-800'}>{compact(st.totalUsed)}</b> / {compact(st.avail)}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {overdrawnPools.length > 0 && (
        <div className="mb-3 rounded-xl border-2 border-rose-500 bg-rose-50 p-3 text-xs text-rose-900" role="alert">
          <div className="flex items-center gap-1.5 font-extrabold text-rose-700 uppercase tracking-wide text-[11px]">
            <Icon name="alert" size={15} /> Cảnh báo vượt ngân sách nguồn tiền!
          </div>
          {overdrawnPools.map((p) => (
            <p key={p.key} className="mt-1 leading-relaxed">
              • Nguồn <b>{p.label}</b> chỉ có thực tế <b>{compact(p.avail)}</b> nhưng tổng các mục tiêu lấy từ nguồn này lên tới <b>{compact(p.totalUsed)}</b> (Đang bị âm <b>{compact(Math.abs(p.balance))}</b>). Hãy chọn mục tiêu quan trọng làm <b>Ưu tiên 1</b> hoặc giảm số tiền phân bổ!
            </p>
          ))}
        </div>
      )}

      {suggestions.length > 0 && (
        <div className="mb-3 rounded-xl border border-indigo-100 bg-indigo-50/70 p-3 space-y-2">
          <div className="flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-wider text-indigo-700">
            <Icon name="sparkles" size={14} /> Gợi ý &amp; Ưu tiên dòng tiền
          </div>
          {suggestions.map((s) => (
            <div key={s.id} className="text-[11px] leading-relaxed text-slate-700 flex flex-wrap items-center justify-between gap-2 bg-white/80 rounded-lg px-2.5 py-1.5 border border-indigo-100/80">
              <span className="flex-1 min-w-[180px]">{s.text}</span>
              {s.onAction && (
                <button type="button" onClick={s.onAction} className="shrink-0 text-[10px] font-bold px-2.5 py-1 rounded-md bg-indigo-600 text-white hover:bg-indigo-500">
                  {s.actionLabel}
                </button>
              )}
            </div>
          ))}
        </div>
      )}

      <div className="space-y-3">
        {data.goals.length === 0 && <p className="text-xs text-slate-400 text-center py-4">Chưa có mục tiêu. Bấm + để thêm.</p>}
        {data.goals.map((g) => {
          const p = g.target > 0 ? (g.current / g.target) * 100 : 0, pj = projectGoal(g, c.surplus);
          const good = pj.kind === 'done' || pj.kind === 'ok', editing = editId === g.id;
          const srcObj = GOAL_SOURCES.find((s) => s.key === (g.source || 'bank')) || GOAL_SOURCES[0];
          const prioObj = PRIORITIES.find((pr) => pr.v === (g.priority || 2)) || PRIORITIES[1];
          const alloc = goalAllocStatus[g.id], isShortfall = alloc && alloc.uncovered > 0;

          return (
            <article key={g.id + (g._owner || '')} className={`rounded-xl border p-3 transition ${isShortfall ? 'border-rose-400 bg-rose-50/40' : 'border-slate-200 bg-slate-50/60'}`}>
              <div className="flex items-center gap-1.5">
                {editing
                  ? <input id={`goal-${g.id}-name`} aria-label="Tên mục tiêu" value={g.name} onChange={(e) => upd(g.id, { name: e.target.value })} className={`${CELL_L} flex-1 min-w-0 font-bold bg-white border-slate-200`} />
                  : <h3 className="flex-1 min-w-0 truncate text-sm font-bold text-slate-800">{g.name}</h3>}
                <span className={`text-sm font-extrabold tnum ${p >= 100 ? 'text-emerald-600' : 'text-indigo-700'}`}>{pcv(p, 0)}</span>
                <IconBtn icon={editing ? 'check' : 'edit'} label={editing ? 'Xong' : 'Sửa mục tiêu'} onClick={() => setEditId(editing ? null : g.id)} />
                <IconBtn tone="rose" icon="trash" label={`Xóa mục tiêu ${g.name}`} onClick={() => del(g.id)} />
              </div>

              <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                <select aria-label="Nguồn vốn" value={g.source || 'bank'} onChange={(e) => upd(g.id, { source: e.target.value })} className={`max-w-full min-w-0 text-[10px] font-bold px-2 py-0.5 rounded-md border cursor-pointer outline-none ${srcObj.bg}`}>
                  {GOAL_SOURCES.map((s) => <option key={s.key} value={s.key}>Nguồn: {s.label}</option>)}
                </select>
                <select aria-label="Mức độ ưu tiên" value={g.priority || 2} onChange={(e) => upd(g.id, { priority: Number(e.target.value) })} className={`max-w-full min-w-0 text-[10px] font-bold px-2 py-0.5 rounded-md border cursor-pointer outline-none ${prioObj.badge}`}>
                  {PRIORITIES.map((pr) => <option key={pr.v} value={pr.v}>{pr.label}</option>)}
                </select>
              </div>

              <div className="mt-2"><Bar pct={p} color={isShortfall ? '#e11d48' : p >= 100 ? '#16a34a' : '#4f46e5'} label={g.name} /></div>

              {editing ? (
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-2.5">
                  <div>
                    <label htmlFor={`goal-${g.id}-cur`} className="text-[10px] font-bold text-slate-500">Phân bổ hiện có</label>
                    <NumInput id={`goal-${g.id}-cur`} value={g.current} onChange={(v) => upd(g.id, { current: v })} className={`${CELL} bg-white border-slate-200 font-bold`} />
                  </div>
                  <div>
                    <label htmlFor={`goal-${g.id}-tgt`} className="text-[10px] font-bold text-slate-500">Mục tiêu cần</label>
                    <NumInput id={`goal-${g.id}-tgt`} value={g.target} onChange={(v) => upd(g.id, { target: v })} className={`${CELL} bg-white border-slate-200 font-bold`} />
                  </div>
                  <div>
                    <label htmlFor={`goal-${g.id}-due`} className="text-[10px] font-bold text-slate-500">Hạn hoàn thành</label>
                    <input id={`goal-${g.id}-due`} type="date" value={g.deadline} onChange={(e) => upd(g.id, { deadline: e.target.value || g.deadline })} className={`${CELL_L} bg-white border-slate-200`} />
                  </div>
                </div>
              ) : (
                <div className="flex flex-wrap items-center justify-between gap-1 text-[11px] text-slate-500 mt-2 tnum">
                  <span>Đang gán: <Money v={g.current} className="font-bold text-slate-800" /> / <Money v={g.target} className="font-bold text-slate-800" /></span>
                  <span>Hạn {fmtDate(parseISO(g.deadline))}</span>
                </div>
              )}

              {isShortfall && (
                <div className="mt-2 rounded-md bg-rose-600 text-white px-2.5 py-1.5 text-[11px] font-semibold leading-snug">
                  ⚠️ Thiếu hụt {compact(alloc.uncovered)} từ nguồn {srcObj.label}! (Sau khi cấp cho mục tiêu ưu tiên cao hơn, nguồn này chỉ còn đủ {compact(alloc.covered)} cho mục tiêu này).
                </div>
              )}

              <p className={`text-[11px] mt-2 leading-snug rounded-md px-2 py-1.5 ${good ? 'bg-emerald-50 text-emerald-800' : pj.kind === 'bad' ? 'bg-amber-50 text-amber-900' : 'bg-slate-100 text-slate-600'}`} title={`Còn thiếu ${vnd(pj.rem)} · thặng dư ${vnd(c.surplus)}/tháng`}>
                {pj.line}{pj.verdict && <b className="block">{pj.verdict}</b>}
              </p>
            </article>
          );
        })}
      </div>
    </Card>
  );
});

const PTABS = [
  { k: 'overview', label: 'Tổng quan', icon: 'home' },
  { k: 'portfolio', label: 'Danh mục', icon: 'pie' },
  { k: 'cash', label: 'Chi tiêu', icon: 'wallet' },
  { k: 'goals', label: 'Mục tiêu', icon: 'target' },
];
const PTITLES = { overview: 'Tổng quan gia sản', portfolio: 'Danh mục đầu tư', cash: 'Chi tiêu & tài sản', goals: 'Mục tiêu tài chính' };

function App() {
  const [view, setView] = useState(loadView);
  const [registry, setRegistry] = useState({ version: 3, users: {} });
  const [currentUserEmail, setCurrentUserEmail] = useState('');
  const [workspaceMode, setWorkspaceMode] = useState('user1');
  const [inspectEmail, setInspectEmail] = useState('');
  const [authStatus, setAuthStatus] = useState('checking');
  const [legacyCipher, setLegacyCipher] = useState(null);
  const [legacyPlain, setLegacyPlain] = useState(null);
  const [showAdminModal, setShowAdminModal] = useState(false);

  const [sync, setSync] = useState(window.supabaseClient ? 'loading' : 'offline');
  const [tab, setTab] = useState('overview');
  const [history, setHistory] = useState(() => loadHistory());
  const [dark, setDark] = useDarkMode();

  const narrow = useNarrow();
  const client = window.supabaseClient;
  const regRef = useRef(registry);
  regRef.current = registry;
  const lastSaved = useRef('');
  const saveTimer = useRef(null);
  const scrollRef = useRef(null);

  const eff = view === 'auto' ? (narrow ? 'phone' : 'auto') : view;
  const isPhone = eff === 'phone';
  const framed = isPhone && !narrow;

  // 1. TẢI DỮ LIỆU ĐÁM MÂY SUPABASE & KIỂM TRA PHIÊN ĐĂNG NHẬP
  const loadRemote = useCallback(async () => {
    if (window.location.search.includes('error=') || window.location.hash.includes('error=')) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    let loadedReg = null;
    if (client) {
      try {
        const { data: row, error } = await client.from('wealthos_data').select('json_data').eq('id', 1).maybeSingle();
        if (error) throw error;
        if (row && row.json_data) {
          const jd = row.json_data;
          if (jd.v3_vault) {
            const bytes = CryptoJS.AES.decrypt(jd.v3_vault, CLOUD_SECRET);
            const str = bytes.toString(CryptoJS.enc.Utf8);
            if (str) loadedReg = JSON.parse(str);
          } else if (jd.version === 3 && jd.users) {
            loadedReg = jd;
          } else if (jd.ciphertext) {
            setLegacyCipher(jd.ciphertext);
          } else {
            setLegacyPlain(normalizeData(jd));
          }
        }
        setSync('ready');
      } catch (e) {
        console.error('Lỗi tải dữ liệu Supabase:', e);
        setSync('error');
      }
    }

    if (!loadedReg) {
      try {
        const localRaw = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (localRaw && localRaw.v3_vault) {
          const bytes = CryptoJS.AES.decrypt(localRaw.v3_vault, CLOUD_SECRET);
          loadedReg = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
        }
      } catch (err) {}
    }

    let oauthUser = null;
    if (client) {
      try {
        const { data: sessionData } = await client.auth.getSession();
        oauthUser = sessionData?.session?.user || null;
      } catch (err) {}
    }

    if (oauthUser && oauthUser.email) {
      const gEmail = cleanEmail(oauthUser.email);
      const gName = oauthUser.user_metadata?.full_name || gEmail.split('@')[0];
      const baseUsers = (loadedReg && loadedReg.users) ? loadedReg.users : {};
      const hasAnyUser = Object.keys(baseUsers).length > 0;

      const nextReg = {
        version: 3,
        users: {
          ...baseUsers,
          [gEmail]: baseUsers[gEmail] || {
            email: gEmail, name: gName, pinHash: hashPin('123456'),
            isAdmin: !hasAnyUser, partnerEmail: '', createdAt: toISO(TODAY),
            data: !hasAnyUser && legacyPlain ? legacyPlain : makeDefaultData(),
          }
        }
      };
      lastSaved.current = JSON.stringify(nextReg);
      setRegistry(nextReg);
      setCurrentUserEmail(gEmail);
      sessionStorage.setItem(SESSION_KEY, gEmail);
      setAuthStatus('authenticated');
      return;
    }

    if (loadedReg && loadedReg.users) {
      lastSaved.current = JSON.stringify(loadedReg);
      setRegistry(loadedReg);
      const savedSession = cleanEmail(sessionStorage.getItem(SESSION_KEY) || '');
      if (savedSession && loadedReg.users[savedSession]) {
        setCurrentUserEmail(savedSession);
        setAuthStatus('authenticated');
      } else {
        setAuthStatus('login');
      }
    } else {
      setAuthStatus('login');
    }
  }, [client, legacyPlain]);

  useEffect(() => {
    loadRemote();
    if (!client) return undefined;
    const { data: authListener } = client.auth.onAuthStateChange((event, session) => {
      if (session && session.user && session.user.email) {
        const gEmail = cleanEmail(session.user.email);
        const gName = session.user.user_metadata?.full_name || gEmail.split('@')[0];
        setRegistry((prev) => {
          const hasAnyUser = Object.keys(prev.users || {}).length > 0;
          if (prev.users && prev.users[gEmail]) return prev;
          return {
            version: 3,
            users: {
              ...(prev.users || {}),
              [gEmail]: {
                email: gEmail, name: gName, pinHash: hashPin('123456'),
                isAdmin: !hasAnyUser, partnerEmail: '', createdAt: toISO(TODAY), data: makeDefaultData(),
              }
            }
          };
        });
        setCurrentUserEmail(gEmail);
        sessionStorage.setItem(SESSION_KEY, gEmail);
        setAuthStatus('authenticated');
      }
    });
    return () => { if (authListener && authListener.subscription) authListener.subscription.unsubscribe(); };
  }, [loadRemote, client]);

  // 2. XÁC THỰC ĐĂNG NHẬP / ĐĂNG KÝ GMAIL
  const handleGmailAuth = ({ mode, email, name, pin, oldPin }) => {
    const users = registry.users || {}, hasUsers = Object.keys(users).length > 0;
    if (mode === 'login') {
      const u = users[email];
      if (!u) return { ok: false, msg: 'Gmail này chưa được đăng ký. Vui lòng chuyển sang tab "Đăng ký Gmail mới".' };
      if (u.pinHash !== hashPin(pin)) return { ok: false, msg: 'Mã PIN / Mật khẩu không chính xác!' };
      setCurrentUserEmail(email);
      sessionStorage.setItem(SESSION_KEY, email);
      setWorkspaceMode('user1');
      setAuthStatus('authenticated');
      return { ok: true };
    } else {
      if (users[email]) return { ok: false, msg: 'Gmail này đã tồn tại trên hệ thống. Vui lòng chọn Đăng nhập.' };
      let initialData = hasUsers ? makeEmptyUserData() : makeDefaultData();
      if (!hasUsers) {
        if (legacyPlain) initialData = legacyPlain;
        else if (legacyCipher && oldPin) {
          try {
            const bytes = CryptoJS.AES.decrypt(legacyCipher, oldPin);
            const str = bytes.toString(CryptoJS.enc.Utf8);
            if (str) initialData = normalizeData(JSON.parse(str));
          } catch (e) {}
        } else {
          try {
            const localLegacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
            if (localLegacy && !localLegacy.ciphertext) initialData = normalizeData(localLegacy);
          } catch (e) {}
        }
      }
      const newUser = { email, name, pinHash: hashPin(pin), isAdmin: !hasUsers, partnerEmail: '', createdAt: toISO(TODAY), data: initialData };
      setRegistry({ version: 3, users: { ...users, [email]: newUser } });
      setCurrentUserEmail(email);
      sessionStorage.setItem(SESSION_KEY, email);
      setWorkspaceMode('user1');
      setAuthStatus('authenticated');
      return { ok: true };
    }
  };

  const handleGoogleOAuth = async () => {
    if (!client) return;
    try {
      const { error } = await client.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) alert('Không thể gọi Google OAuth: ' + error.message);
    } catch (e) {
      alert('Vui lòng nhập trực tiếp địa chỉ Gmail và mã PIN ở khung bên trên để đăng nhập.');
    }
  };

  // 3. XÁC ĐỊNH DỮ LIỆU ĐANG HIỂN THỊ
  const meUser = registry.users?.[currentUserEmail] || null;
  const partnerEmail = meUser?.partnerEmail ? cleanEmail(meUser.partnerEmail) : '';
  const partnerUser = partnerEmail && registry.users?.[partnerEmail] ? registry.users[partnerEmail] : null;

  const activeData = useMemo(() => {
    if (!meUser) return makeDefaultData();
    if (workspaceMode === 'user2' && partnerUser) return normalizeData(partnerUser.data);
    if (workspaceMode === 'combined' && partnerUser) {
      return mergeCoupleData(meUser.data, partnerUser.data, meUser.name, partnerUser.name, meUser.email, partnerUser.email);
    }
    if (workspaceMode === 'admin_inspect' && inspectEmail && registry.users?.[inspectEmail]) {
      return normalizeData(registry.users[inspectEmail].data);
    }
    return normalizeData(meUser.data);
  }, [meUser, partnerUser, workspaceMode, inspectEmail, registry.users]);

  // Luôn gọi Hooks useMemo trước mọi câu lệnh điều kiện rẽ nhánh (Chống React Error #310)
  const c = useMemo(() => compute(activeData), [activeData]);
  const combinedNet = useMemo(() => {
    if (!partnerUser || !meUser) return c.net;
    return compute(mergeCoupleData(meUser.data, partnerUser.data, meUser.name, partnerUser.name, meUser.email, partnerUser.email)).net;
  }, [meUser, partnerUser, c.net]);

  // 4. HÀM CẬP NHẬT DỮ LIỆU THÔNG MINH
  const setData = useCallback((updater) => {
    setRegistry((prev) => {
      const curMe = prev.users?.[currentUserEmail];
      if (!curMe) return prev;
      const pMail = curMe.partnerEmail ? cleanEmail(curMe.partnerEmail) : '';
      const curPartner = pMail ? prev.users?.[pMail] : null;

      if (workspaceMode === 'user1' || (!curPartner && workspaceMode !== 'admin_inspect')) {
        const updated = updater(normalizeData(curMe.data));
        return { ...prev, users: { ...prev.users, [currentUserEmail]: { ...curMe, data: updated } } };
      }
      if (workspaceMode === 'user2' && curPartner) {
        const updated = updater(normalizeData(curPartner.data));
        return { ...prev, users: { ...prev.users, [pMail]: { ...curPartner, data: updated } } };
      }
      if (workspaceMode === 'admin_inspect' && inspectEmail && prev.users?.[inspectEmail]) {
        const targetU = prev.users[inspectEmail];
        const updated = updater(normalizeData(targetU.data));
        return { ...prev, users: { ...prev.users, [inspectEmail]: { ...targetU, data: updated } } };
      }
      if (workspaceMode === 'combined' && curPartner) {
        const d1 = normalizeData(curMe.data), d2 = normalizeData(curPartner.data);
        const mergedBefore = mergeCoupleData(d1, d2, curMe.name, curPartner.name, curMe.email, curPartner.email);
        const mergedAfter = updater(mergedBefore);

        const splitList = (list) => {
          const u1List = [], u2List = [];
          (list || []).forEach((item) => {
            const cleanItem = { ...item };
            if (item._owner === pMail) {
              cleanItem.name = String(cleanItem.name || '').replace(` (${curPartner.name})`, '').replace(` [${curPartner.name}]`, '');
              u2List.push(cleanItem);
            } else {
              cleanItem.name = String(cleanItem.name || '').replace(` (${curMe.name})`, '').replace(` [${curMe.name}]`, '');
              u1List.push({ ...cleanItem, _owner: curMe.email });
            }
          });
          return [u1List, u2List];
        };

        const [stocks1, stocks2] = splitList(mergedAfter.stocks);
        const [gold1, gold2] = splitList(mergedAfter.gold);
        const [sav1, sav2] = splitList(mergedAfter.savings);
        const [cat1, cat2] = splitList(mergedAfter.categories);
        const [goals1, goals2] = splitList(mergedAfter.goals);

        const nextD1 = {
          ...d1,
          cash: d1.cash + (mergedAfter.cash - mergedBefore.cash),
          receivable: d1.receivable + (mergedAfter.receivable - mergedBefore.receivable),
          estate: d1.estate + (mergedAfter.estate - mergedBefore.estate),
          income: d1.income + (mergedAfter.income - mergedBefore.income),
          budget: d1.budget + (mergedAfter.budget - mergedBefore.budget),
          fireTarget: d1.fireTarget + (mergedAfter.fireTarget - mergedBefore.fireTarget),
          debts: {
            risk: Math.max(0, d1.debts.risk + (mergedAfter.debts.risk - mergedBefore.debts.risk)),
            safe: Math.max(0, d1.debts.safe + (mergedAfter.debts.safe - mergedBefore.debts.safe)),
            fixed: Math.max(0, d1.debts.fixed + (mergedAfter.debts.fixed - mergedBefore.debts.fixed)),
          },
          targets: mergedAfter.targets, recMode: mergedAfter.recMode,
          stocks: stocks1, gold: gold1, savings: sav1, categories: cat1, goals: goals1,
        };
        const nextD2 = { ...d2, stocks: stocks2, gold: gold2, savings: sav2, categories: cat2, goals: goals2 };
        return { ...prev, users: { ...prev.users, [currentUserEmail]: { ...curMe, data: nextD1 }, [pMail]: { ...curPartner, data: nextD2 } } };
      }
      return prev;
    });
  }, [currentUserEmail, workspaceMode, inspectEmail]);

  // 5. GHI LỊCH SỬ TÀI SẢN RÒNG & ĐỒNG BỘ MÃ HÓA ĐA LUỒNG (WEB WORKER)
  const historyScope = `${currentUserEmail || 'default'}-${workspaceMode}`;
  useEffect(() => {
    if (authStatus !== 'authenticated') return;
    setHistory(saveSnapshot(c, historyScope));
  }, [authStatus, historyScope, c.total, c.debt, c.net]);

  const flush = useCallback(async () => {
    if (authStatus !== 'authenticated' || !Object.keys(regRef.current.users || {}).length) return;
    if (!client) return;

    const myEmail = currentUserEmail, myUserObj = regRef.current.users[myEmail];
    if (!myUserObj) return;

    setSync('saving');
    try {
      const { data: row, error: fetchErr } = await client.from('wealthos_data').select('json_data').eq('id', 1).maybeSingle();
      if (fetchErr) throw fetchErr;

      let latestReg = regRef.current;
      if (row && row.json_data && row.json_data.v3_vault) {
        const bytes = CryptoJS.AES.decrypt(row.json_data.v3_vault, CLOUD_SECRET);
        const str = bytes.toString(CryptoJS.enc.Utf8);
        if (str) {
          const cloudReg = JSON.parse(str);
          const nextUsers = { ...cloudReg.users, [myEmail]: myUserObj };
          if (workspaceMode === 'user2' || workspaceMode === 'combined') {
            const pMail = myUserObj.partnerEmail ? cleanEmail(myUserObj.partnerEmail) : '';
            if (pMail && regRef.current.users[pMail]) nextUsers[pMail] = regRef.current.users[pMail];
          }
          if (workspaceMode === 'admin_inspect' && inspectEmail && regRef.current.users[inspectEmail]) {
            nextUsers[inspectEmail] = regRef.current.users[inspectEmail];
          }
          latestReg = { ...cloudReg, users: nextUsers };
        }
      }

      const strToSave = JSON.stringify(latestReg);
      if (strToSave === lastSaved.current) { setSync('ready'); return; }

      const v3_vault = await window.encryptVaultAsync(strToSave, CLOUD_SECRET);
      const { error: upsertErr } = await client.from('wealthos_data').upsert({ id: 1, json_data: { v3_vault } });
      if (upsertErr) throw upsertErr;

      lastSaved.current = strToSave;
      try { localStorage.setItem(KEY, JSON.stringify({ v3_vault })); } catch (e) {}

      setRegistry(latestReg);
      setSync('ready');
    } catch (err) {
      console.error('Lỗi lưu Supabase:', err);
      setSync('error');
    }
  }, [authStatus, client, currentUserEmail, workspaceMode, inspectEmail]);

  useEffect(() => {
    if (authStatus !== 'authenticated' || !Object.keys(registry.users || {}).length) return undefined;
    const str = JSON.stringify(registry);
    if (str === lastSaved.current) return undefined;

    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      if (client) {
        await flush();
      } else {
        const v3_vault = await window.encryptVaultAsync(str, CLOUD_SECRET);
        try { localStorage.setItem(KEY, JSON.stringify({ v3_vault })); } catch (e) {}
      }
    }, 1500);
    return () => clearTimeout(saveTimer.current);
  }, [registry, authStatus, client, flush]);

  const retry = () => { if (authStatus === 'authenticated') flush(); else loadRemote(); };

  useEffect(() => { try { localStorage.setItem(VIEW_KEY, view); } catch (e) {} }, [view]);
  
  useEffect(() => {
    if (!isPhone || authStatus !== 'authenticated') return undefined;
    document.documentElement.classList.add('lock');
    document.body.classList.add('lock');
    return () => { document.documentElement.classList.remove('lock'); document.body.classList.remove('lock'); };
  }, [isPhone, authStatus]);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [tab, isPhone]);

  const handleLogout = async () => {
    sessionStorage.removeItem(SESSION_KEY);
    if (client) { try { await client.auth.signOut(); } catch (e) {} }
    setCurrentUserEmail('');
    setAuthStatus('login');
  };

  if (authStatus === 'checking') {
    return <div className="min-h-screen grid place-items-center bg-slate-50 text-slate-500 font-bold">Đang đồng bộ hệ thống đám mây...</div>;
  }

  if (authStatus === 'login' || !meUser) {
    return (
      <GmailAuthScreen
        hasUsers={Object.keys(registry.users || {}).length > 0}
        legacyCipher={legacyCipher}
        onAuthSuccess={handleGmailAuth}
        onGoogleOAuth={handleGoogleOAuth}
      />
    );
  }

  const allUsersList = Object.values(registry.users || {});

  const coworkToolbar = (
    <div className="bg-white border border-slate-200 rounded-2xl p-2 sm:px-3.5 flex flex-col gap-2 shadow-sm no-print">
      <div className="flex items-center gap-1.5 overflow-x-auto thin-scroll pb-1">
        <button type="button" onClick={() => setWorkspaceMode('user1')}
          className={`shrink-0 inline-flex items-center gap-1 text-[11px] sm:text-xs font-bold px-2.5 py-1.5 rounded-xl transition ${workspaceMode === 'user1' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
          👤 User 1: {meUser.name}
        </button>

        {partnerUser ? (
          <>
            <button type="button" onClick={() => setWorkspaceMode('user2')}
              className={`shrink-0 inline-flex items-center gap-1 text-[11px] sm:text-xs font-bold px-2.5 py-1.5 rounded-xl transition ${workspaceMode === 'user2' ? 'bg-pink-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
              👩 User 2: {partnerUser.name}
            </button>
            <button type="button" onClick={() => setWorkspaceMode('combined')}
              className={`shrink-0 inline-flex items-center gap-1 text-[11px] sm:text-xs font-extrabold px-3 py-1.5 rounded-xl transition ${workspaceMode === 'combined' ? 'bg-emerald-600 text-white shadow-sm ring-2 ring-emerald-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100'}`}>
              💑 Tổng 2 VC ({compact(combinedNet)})
            </button>
          </>
        ) : (
          <button type="button" onClick={() => setShowAdminModal(true)}
            className="shrink-0 inline-flex items-center gap-1 text-[11px] sm:text-xs font-bold px-2.5 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100">
            + Liên kết Vợ (User 2)
          </button>
        )}

        {meUser.isAdmin && allUsersList.length > 1 && (
          <select aria-label="Admin xem hồ sơ thành viên" value={workspaceMode === 'admin_inspect' ? inspectEmail : ''}
            onChange={(e) => {
              if (e.target.value) { setInspectEmail(e.target.value); setWorkspaceMode('admin_inspect'); }
              else setWorkspaceMode('user1');
            }}
            className="shrink-0 text-[11px] sm:text-xs font-bold px-2 py-1.5 rounded-xl bg-rose-50 text-rose-800 border border-rose-200 outline-none cursor-pointer">
            <option value="">👑 Admin ({allUsersList.length})</option>
            {allUsersList.map((u) => <option key={u.email} value={u.email}>👁️ Xem: {u.name} ({u.email})</option>)}
          </select>
        )}
      </div>

      <div className="flex items-center justify-between gap-1.5 pt-1 border-t border-slate-100">
        <button type="button" onClick={() => setShowAdminModal(true)}
          className="inline-flex items-center gap-1 text-[11px] sm:text-xs font-bold px-2.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200">
          {meUser.isAdmin ? '👑 Quản trị & Co-work' : '⚙️ Co-work & PIN'}
        </button>
        <button type="button" onClick={handleLogout} title="Đăng xuất Gmail"
          className="inline-flex items-center gap-1 text-[11px] sm:text-xs font-bold px-2.5 py-1.5 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100">
          <Icon name="logout" size={13} /> Thoát
        </button>
      </div>
    </div>
  );

  const outer = V(eff, 'w-full', 'w-full overflow-x-auto thin-scroll', 'w-full overflow-x-hidden');
  const frame = V(eff, '', 'min-w-[1200px] p-4', 'max-w-[1600px] mx-auto p-3 sm:p-4 overflow-x-hidden');
  const root = `grid gap-4 ${V(eff, 'grid-cols-1', 'grid-cols-12', 'grid-cols-1 lg:grid-cols-12')}`;
  const tier = V(eff, '', 'col-span-12', 'lg:col-span-12');
  const kpiGrid = V(eff, 'grid-cols-2', 'grid-cols-[1.4fr_1fr_1fr_1fr_1.2fr]', 'grid-cols-2 lg:grid-cols-[1.4fr_1fr_1fr_1fr_1.2fr]');
  const netSpan = V(eff, 'col-span-2', '', 'col-span-2 lg:col-span-1');
  const midGrid = V(eff, 'grid-cols-1', 'grid-cols-[35fr_65fr]', 'grid-cols-1 lg:grid-cols-[35fr_65fr]');
  const botGrid = V(eff, 'grid-cols-1', 'grid-cols-3', 'grid-cols-1 lg:grid-cols-3');
  const head = V(eff, 'flex-col', 'flex-row items-end', 'flex-col lg:flex-row lg:items-end');

  const kpiBlock = (
    <div className={`${tier} grid gap-3 ${kpiGrid}`}>
      <Kpi small={isPhone} dark className={netSpan} label="Tổng tài sản ròng" sub={vnd(c.net)}><span title={vnd(c.net)}>{big(c.net)}</span></Kpi>
      <Kpi small={isPhone} label="Tổng tài sản" sub={vnd(c.total)}><span title={vnd(c.total)}>{big(c.total)}</span></Kpi>
      <Kpi small={isPhone} label="Tổng nợ" sub={`Chiếm ${pcv(c.total > 0 ? (c.debt / c.total) * 100 : 0)} tổng tài sản`} bar={c.total > 0 ? (c.debt / c.total) * 100 : 0} barColor="#f97316"><span className="text-orange-600" title={vnd(c.debt)}>{big(c.debt)}</span></Kpi>
      <Kpi small={isPhone} className={isPhone ? 'col-span-2' : ''} label="Dòng tiền thặng dư (tháng)" sub={`Thu ${compact(activeData.income)} − chi ${compact(c.spent)} · tiết kiệm ${pcv(activeData.income > 0 ? (c.surplus / activeData.income) * 100 : 0)}`}>
        <span className={c.surplus >= 0 ? 'text-emerald-600' : 'text-rose-600'} title={vnd(c.surplus)}>{c.surplus >= 0 ? '+ ' : '− '}{fixed2(Math.abs(c.surplus) / 1e6)} triệu</span>
      </Kpi>
      <Kpi small={isPhone} className={isPhone ? 'col-span-2' : ''} label="Mức độ tự do tài chính (FIRE)" sub={activeData.fireTarget > 0 ? `Mục tiêu FIRE ${compact(c.fireTarget)}` : `Tự động: 25 × chi tiêu năm = ${compact(c.fireTarget)}`} bar={c.firePct} barColor="#4f46e5"
        extra={
          <div className="flex items-center gap-1.5 mt-2">
            <label htmlFor="fire-target" className="text-[10px] font-bold text-slate-500 shrink-0">Mục tiêu FIRE</label>
            <NumInput id="fire-target" blankZero value={activeData.fireTarget} placeholder="Tự động" onChange={(v) => setData((d) => ({ ...d, fireTarget: v }))} className="w-full min-w-0 rounded-md border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-xs font-bold tnum text-right outline-none focus:border-indigo-400 focus:bg-white" />
          </div>
        }>
        <span className="text-indigo-700">{pcv(c.firePct, c.firePct < 10 ? 1 : 0)} <span className="text-sm font-bold text-slate-500">mục tiêu</span></span>
      </Kpi>
    </div>
  );

  const allocation = <AllocationCard data={activeData} setData={setData} c={c} view={eff} />;
  const portfolio = <Portfolio data={activeData} setData={setData} c={c} view={eff} isCombined={workspaceMode === 'combined'} />;
  const topAssets = <TopAssetsCard data={activeData} c={c} />;
  const spending = <SpendingCard data={activeData} setData={setData} c={c} view={eff} />;
  const goals = <GoalsCard data={activeData} setData={setData} c={c} />;

  const activeTitle = workspaceMode === 'combined' && partnerUser
    ? `TỔNG GIA SẢN 2 VỢ CHỒNG (${meUser.name.toUpperCase()} & ${partnerUser.name.toUpperCase()})`
    : workspaceMode === 'user2' && partnerUser
    ? `BÁO CÁO GIA SẢN · ${partnerUser.name.toUpperCase()}`
    : workspaceMode === 'admin_inspect' && inspectEmail
    ? `HỒ SƠ THÀNH VIÊN · ${registry.users[inspectEmail]?.name.toUpperCase()}`
    : `BÁO CÁO TỔNG QUAN GIA SẢN · ${meUser.name.toUpperCase()}`;

  if (isPhone) {
    const shell = (
      <div className="flex flex-col h-full w-full bg-slate-50 overflow-hidden">
        {framed && <StatusBar />}
        <header className="shrink-0 bg-white border-b border-slate-200 px-4 pb-2.5 flex items-center justify-between gap-2" style={{ paddingTop: framed ? 4 : 'max(10px, env(safe-area-inset-top, 0px))' }}>
          <div className="min-w-0">
            <p className="text-[10px] font-bold tracking-widest text-indigo-600">
              WEALTHOS PRO · {meUser.isAdmin ? 'ADMIN' : 'GIA SẢN'}
            </p>
            <h1 className="text-[15px] leading-tight font-extrabold text-slate-900 truncate">{PTITLES[tab]}</h1>
            <SyncBadge sync={sync} onRetry={retry} />
          </div>
          <div className="flex items-center gap-1 no-print">
            <button type="button" onClick={() => setDark(d => !d)} title={dark ? 'Sáng' : 'Tối'}
              className="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition" aria-label="Đổi giao diện">
              <Icon name={dark ? 'sparkles' : 'moon'} size={16} />
            </button>
            <button type="button" onClick={() => window.print()} title="In / PDF"
              className="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition" aria-label="In báo cáo">
              <Icon name="print" size={16} />
            </button>
            <ViewSwitcher view={view} setView={setView} compact />
          </div>
        </header>
        <main ref={scrollRef} className="app-scroll flex-1 min-h-0 px-3 py-3 space-y-3">
          {coworkToolbar}
          {tab === 'overview' && <div className="space-y-3">{kpiBlock}<NetWorthCard history={history} />{allocation}</div>}
          {tab === 'portfolio' && <div className="space-y-3">{portfolio}</div>}
          {tab === 'cash' && <div className="space-y-3">{spending}{topAssets}</div>}
          {tab === 'goals' && <div className="space-y-3">{goals}</div>}
          <div className="h-2" />
        </main>
        <nav aria-label="Điều hướng" className="shrink-0 grid grid-cols-4 bg-white border-t border-slate-200" style={{ paddingBottom: framed ? 10 : 'max(6px, env(safe-area-inset-bottom, 0px))' }}>
          {PTABS.map((t) => (
            <button key={t.k} type="button" onClick={() => setTab(t.k)} aria-current={tab === t.k ? 'page' : undefined}
              className={`flex flex-col items-center gap-0.5 pt-2 pb-1 text-[10px] font-bold ${tab === t.k ? 'text-indigo-600' : 'text-slate-400'}`}>
              <Icon name={t.icon} size={20} />{t.label}
            </button>
          ))}
        </nav>
        {showAdminModal && (
          <AdminCoworkModal
            registry={registry}
            currentUserEmail={currentUserEmail}
            onClose={() => setShowAdminModal(false)}
            onSaveRegistry={(nextReg) => setRegistry(nextReg)}
            onSelectInspectUser={(uMail) => { setInspectEmail(uMail); setWorkspaceMode('admin_inspect'); }}
          />
        )}
      </div>
    );
    if (!framed) return <div className="fixed inset-0 w-full">{shell}</div>;
    return (
      <div className="min-h-screen w-full grid place-items-center bg-slate-200 p-4 overflow-hidden">
        <div className="relative rounded-[56px] bg-slate-900 p-[10px] shadow-2xl" style={{ width: 410 }}>
          <div className="relative overflow-hidden rounded-[46px] bg-white" style={{ height: 'min(830px, calc(100dvh - 56px))', transform: 'translateZ(0)' }}>
            <div className="absolute left-1/2 top-2 z-40 h-[26px] w-[92px] -translate-x-1/2 rounded-full bg-black" aria-hidden="true" />
            {shell}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 p-2 sm:p-4 overflow-x-hidden">
      <div className={outer}>
        <div className={frame}>
          <div className={root}>
            <div className={tier}>{coworkToolbar}</div>

            <header className={`${tier} flex ${head} justify-between gap-3`}>
              <div className="min-w-0">
                <p className="inline-flex items-center gap-1.5 text-[11px] font-bold tracking-widest text-indigo-600">
                  <Icon name="layers" size={14} />WEALTHOS PRO · {meUser.isAdmin ? 'ADMIN TỐI THƯỢNG' : 'QUẢN LÝ GIA SẢN & TỰ DO TÀI CHÍNH'}
                </p>
                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 mt-1">{activeTitle}</h1>
                <p className="text-xs text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                  <SyncBadge sync={sync} onRetry={retry} />
                  <span>Gmail: <b>{currentUserEmail}</b> · VNĐ · <LiveClock /></span>
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-2 no-print">
                <DarkToggle dark={dark} setDark={setDark} />
                <button type="button" onClick={() => window.print()}
                  title="Xuất PDF / In báo cáo"
                  className="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg bg-white border border-slate-200 shadow-sm text-slate-600 hover:bg-slate-100 transition">
                  <Icon name="print" size={14} />PDF
                </button>
                <ViewSwitcher view={view} setView={setView} />
              </div>
            </header>

            {kpiBlock}

            <div className={`${tier} grid gap-4 items-start ${midGrid}`}>
              {allocation}
              <div className="space-y-4">
                 <NetWorthCard history={history} />
              </div>
            </div>

            <div className={tier}>{portfolio}</div>

            <div className={`${tier} grid gap-4 items-start ${botGrid}`}>
              {topAssets}
              {spending}
              {goals}
            </div>
          </div>
        </div>
      </div>

      {showAdminModal && (
        <AdminCoworkModal
          registry={registry}
          currentUserEmail={currentUserEmail}
          onClose={() => setShowAdminModal(false)}
          onSaveRegistry={(nextReg) => setRegistry(nextReg)}
          onSelectInspectUser={(uMail) => { setInspectEmail(uMail); setWorkspaceMode('admin_inspect'); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
