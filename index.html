const fmt = (n) => {
  const v = Math.round(num(n));
  const s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (v < 0 ? '-' : '') + s;
};
const vnd = (n) => fmt(n) + ' ₫';
const trim2 = (x) => String(Math.round(x * 100) / 100).replace('.', ',');
const fixed2 = (x) => x.toFixed(2).replace('.', ',');
const compact = (n) => {
  const v = num(n), a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e9) return s + trim2(a / 1e9) + ' tỷ';
  if (a >= 1e6) return s + trim2(a / 1e6) + 'tr';
  if (a >= 1e3) return s + trim2(a / 1e3) + 'k';

};
const big = (n) => {

};

function normalizeData(raw) {
  const base = makeDefaultData();
  if (!raw || typeof raw !== 'object') return base;
  // Tự động lấy dữ liệu đúng nếu cấu trúc cũ trên Supabase vẫn còn bọc trong { mode, original, demo }
  const src = (raw.original || raw.demo) ? (raw[raw.mode] || raw.demo || raw.original) : raw;
  const out = { ...base, ...src };
  out.targets = { ...base.targets, ...(src.targets || {}) };
  CLASSES.forEach((c) => { out.targets[c.key] = num(out.targets[c.key]); });
  ['cash', 'receivable', 'estate', 'income', 'budget', 'fireTarget'].forEach((k) => { out[k] = num(out[k]); });
  out.estateName = String(out.estateName || '');
  const rd = src.debts && typeof src.debts === 'object' ? src.debts : (src.liabilities ? { safe: src.liabilities } : base.debts);
  out.debts = { risk: num(rd.risk), safe: num(rd.safe), fixed: num(rd.fixed) };
  const list = (k) => (Array.isArray(src[k]) ? src[k] : base[k]);
  out.stocks = list('stocks').map((r) => ({ id: r.id || uid(), code: String(r.code || ''), qty: num(r.qty), cost: num(r.cost), price: num(r.price), target: num(r.target), dir: num(r.dir) }));
  out.gold = list('gold').map((r) => ({ id: r.id || uid(), type: String(r.type || ''), qty: num(r.qty), cost: num(r.cost), price: num(r.price), target: num(r.target) }));
  out.savings = list('savings').map((r) => ({ id: r.id || uid(), bank: String(r.bank || ''), principal: num(r.principal), rate: num(r.rate), term: num(r.term), start: typeof r.start === 'string' && r.start ? r.start : toISO(TODAY) }));
  out.categories = list('categories').map((r, i) => ({
    id: r.id || uid(), name: String(r.name || ''), color: r.color || CAT_COLORS[i % CAT_COLORS.length], amount: num(r.amount),
    items: (Array.isArray(r.items) ? r.items : []).map((it) => ({ id: it.id || uid(), name: String(it.name || ''), amount: num(it.amount) })),
  }));
  out.goals = list('goals').map((r) => ({
    id: r.id || uid(),
    name: String(r.name || ''),
    current: num(r.current),
    target: num(r.target),
    deadline: typeof r.deadline === 'string' && r.deadline ? r.deadline : toISO(addMonths(TODAY, 12)),
    source: GOAL_SOURCES.some((s) => s.key === r.source) ? r.source : 'bank',
    priority: [1, 2, 3].includes(num(r.priority)) ? num(r.priority) : 2,
  }));
  out.recMode = src.recMode === 'monthly' ? 'monthly' : 'rebalance';
  return out;
}

function loadLocalData() {

  } catch (e) {
    return makeDefaultData();

}

const catTotal = (c) => (c.items.length ? sum(c.items, (i) => i.amount) : num(c.amount));

function compute(d) {
  const stockTotal = sum(d.stocks, (r) => r.qty * r.price);
  const goldTotal = sum(d.gold, (r) => r.qty * r.price);
  const bankTotal = sum(d.savings, (r) => r.principal);
  const actual = { stock: stockTotal, gold: goldTotal, bank: bankTotal, cash: d.cash, recv: d.receivable, estate: d.estate };
  const total = sum(CLASSES, (c) => actual[c.key]);
  const debt = d.debts.risk + d.debts.safe + d.debts.fixed;
  const pct = {};
  CLASSES.forEach((c) => { pct[c.key] = total > 0 ? (actual[c.key] / total) * 100 : 0; });
  const spent = sum(d.categories, catTotal);
  const net = total - debt;
  const fireTarget = d.fireTarget > 0 ? d.fireTarget : spent * 12 * 25;
  const groups = GROUPS.map((g) => {
    const assets = sum(CLASSES.filter((c) => c.group === g.key), (c) => actual[c.key]);
    return { ...g, assets, debt: d.debts[g.key], equity: assets - d.debts[g.key] };
  });
  return {
    stockTotal,
    goldTotal,
    bankTotal,
    actual,
    total,
    debt,
    net,
    pct,
    spent,
    groups,
    fireTarget,
    surplus: d.income - spent,
    firePct: fireTarget > 0 ? Math.max(0, (net / fireTarget) * 100) : 0,
    targetSum: sum(CLASSES, (c) => d.targets[c.key])
  };
}

function simulatePrice(r) {
  if (!(r.price > 0)) return r;
  const move = (0.01 + Math.random() * 0.02) * (Math.random() < 0.5 ? -1 : 1);
  const next = Math.max(10, Math.round((r.price * (1 + move)) / 10) * 10);
  return { ...r, price: next, dir: next >= r.price ? 1 : -1 };
}

function niceAxis(max) {
  const m = max > 0 ? max : 1e6;
  const base = Math.pow(10, Math.floor(Math.log10(m / 4)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * base).find((s) => s * 4 >= m) || 10 * base;
  const n = Math.max(1, Math.ceil(m / step));
  return { max: n * step, ticks: Array.from({ length: n + 1 }, (_, i) => i * step) };
}

function sanitizeDec(raw) {
  let seen = false, out = '';
  for (const ch of raw) {
    if (ch === ',' || ch === '.') { if (!seen) { seen = true; out += ','; } }
    else if (ch >= '0' && ch <= '9') out += ch;
  }
  return out;
}

function NumInput({ value, onChange, decimal = false, className = '', placeholder = '0', id, ariaLabel, blankZero = false }) {
  const toTxt = (v) => (decimal ? String(num(v)).replace('.', ',') : (num(v) === 0 ? (blankZero ? '' : '0') : fmt(v)));
  const parse = (t) => (decimal ? num(t.replace(',', '.')) : num(t.replace(/\D/g, '')));
  const [txt, setTxt] = useState(toTxt(value));
  useEffect(() => { if (parse(txt) !== num(value)) setTxt(toTxt(value)); }, [value]);
  const handle = (e) => {
    const raw = e.target.value;
    if (decimal) {
      const t = sanitizeDec(raw);
      setTxt(t);
      onChange(parse(t));
    } else {
      const digits = raw.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      setTxt(digits === '' ? '' : fmt(Number(digits)));
      onChange(digits === '' ? 0 : Number(digits));
    }
  };
  return <input id={id} aria-label={ariaLabel} type="text" inputMode={decimal ? 'decimal' : 'numeric'} value={txt} onChange={handle} placeholder={placeholder} className={className} autoComplete="off" />;
}

function DonutChart({ actual, targets, total, size = 'w-44 h-44' }) {
  const [hv, setHv] = useState(null);
  const aSum = CLASSES.reduce((s, c) => s + Math.max(0, actual[c.key]), 0);
  const tSum = CLASSES.reduce((s, c) => s + Math.max(0, targets[c.key]), 0);
  const rings = [
    { id: 'out', r: 86, sw: 24, sum: aSum, items: CLASSES.map((c) => ({ c, v: Math.max(0, actual[c.key]) })) },
    { id: 'in', r: 57, sw: 18, sum: tSum, items: CLASSES.map((c) => ({ c, v: Math.max(0, targets[c.key]) })) },
  ];
  let info = null;
  if (hv) {
    const c = CLASSES.find((x) => x.key === hv.key);
    info = hv.ring === 'out'
      ? { head: 'Thực tế', label: c.label, amount: actual[c.key], p: aSum > 0 ? (actual[c.key] / aSum) * 100 : 0, color: c.ink }
      : { head: 'Mục tiêu', label: c.label, amount: (total * targets[c.key]) / 100, p: targets[c.key], color: c.ink };
  }
  return (
    <svg viewBox="0 0 220 220" className={`${size} shrink-0`} role="img" aria-label="Donut kép: vòng ngoài thực tế, vòng trong mục tiêu">
      {rings.map((ring) => {
        const C = 2 * Math.PI * ring.r;
        let acc = 0;
        return (
          <g key={ring.id}>
            <circle cx="110" cy="110" r={ring.r} fill="none" stroke="#e2e8f0" strokeWidth={ring.sw} />
            {ring.sum > 0 && ring.items.map(({ c, v }) => {
              const len = (v / ring.sum) * C;
              const off = acc;
              acc += len;
              if (len <= 0) return null;
              const dim = hv && !(hv.ring === ring.id && hv.key === c.key);
              return (
                <circle key={c.key} cx="110" cy="110" r={ring.r} fill="none" stroke={c.color} strokeWidth={ring.sw}
                  strokeDasharray={`${len} ${C - len}`} strokeDashoffset={-off} transform="rotate(-90 110 110)"
                  style={{ opacity: dim ? 0.3 : 1, cursor: 'pointer', transition: 'opacity .15s' }}
                  onMouseEnter={() => setHv({ ring: ring.id, key: c.key })} onMouseLeave={() => setHv(null)}
                  onClick={() => setHv((h) => (h && h.ring === ring.id && h.key === c.key ? null : { ring: ring.id, key: c.key }))}>
                  <title>{`${ring.id === 'out' ? 'Thực tế' : 'Mục tiêu'} · ${c.label}: ${pcv((v / ring.sum) * 100, 0)}`}</title>
                </circle>
              );
            })}
          </g>
        );
      })}
      {info ? (
        <g textAnchor="middle" style={{ pointerEvents: 'none' }}>
          <text x="110" y="94" fontSize="12" fill="#64748b" fontWeight="600">{info.head}</text>
          <text x="110" y="110" fontSize="13" fill={info.color} fontWeight="700">{info.label}</text>
          <text x="110" y="128" fontSize="16" fill="#0f172a" fontWeight="800">{compact(info.amount)}</text>
          <text x="110" y="143" fontSize="12" fill="#475569" fontWeight="600">{pcv(info.p, 0)}</text>
        </g>
      ) : (
        <g textAnchor="middle" style={{ pointerEvents: 'none' }}>
          <text x="110" y="102" fontSize="12" fill="#64748b" fontWeight="600">Tổng TS</text>
          <text x="110" y="124" fontSize="19" fill="#0f172a" fontWeight="800">{compact(total)}</text>
        </g>
      )}
    </svg>
  );
}

function AllocationCard({ data, setData, c, view }) {
  const setTarget = (k, v) => setData((d) => ({ ...d, targets: { ...d.targets, [k]: v } }));
  const targetOk = Math.abs(c.targetSum - 100) < 0.001;
  const autos = { stock: c.stockTotal, gold: c.goldTotal, bank: c.bankTotal };
  const entry = {
    cash: [data.cash, (v) => setData((d) => ({ ...d, cash: v }))],
    recv: [data.receivable, (v) => setData((d) => ({ ...d, receivable: v }))],
    estate: [data.estate, (v) => setData((d) => ({ ...d, estate: v }))]
  };
  const mode = data.recMode;
  const S = c.surplus;
  const rows = CLASSES.map((cl) => {
    const target = (c.total * data.targets[cl.key]) / 100;
    return { cl, actual: c.actual[cl.key], target, diff: target - c.actual[cl.key] };
  });
  let monthly = rows.map(() => 0);
  if (mode === 'monthly' && S > 0) {
    const newTotal = c.total + S;
    const gaps = CLASSES.map((cl) => Math.max(0, (newTotal * data.targets[cl.key]) / 100 - c.actual[cl.key]));
    const gapSum = gaps.reduce((a, b) => a + b, 0);
    monthly = gaps.map((g) => (gapSum > 0 ? (g * S) / gapSum : 0));
  }
  const shown = rows.map((r, i) => ({ ...r, i })).filter((r) => r.actual > 0 || r.target > 0);
  return (
    <Card title="Cơ cấu danh mục đầu tư" right={<span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${targetOk ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`} role={targetOk ? undefined : 'alert'}>MỤC TIÊU: {pcv(c.targetSum, Number.isInteger(c.targetSum) ? 0 : 1)}</span>}>
      <div className="flex justify-center"><DonutChart actual={c.actual} targets={data.targets} total={c.total} /></div>
      <p className="text-[10px] text-center text-slate-400 mt-1 mb-3">Vòng ngoài: thực tế · Vòng trong: mục tiêu</p>
      <div className={`grid ${view === 'phone' ? 'grid-cols-[10px_minmax(0,1fr)_92px_34px_46px]' : 'grid-cols-[10px_minmax(0,1fr)_112px_40px_52px]'} items-center gap-x-2 gap-y-1.5 text-xs`}>
        <span /><span /><span className="text-[10px] font-semibold text-slate-400 text-right">Giá trị (₫)</span><span className="text-[10px] font-semibold text-slate-400 text-right">TT</span><span className="text-[10px] font-semibold text-slate-400 text-right">MT %</span>
        {CLASSES.map((cl) => (
          <React.Fragment key={cl.key}>
            <span className="h-2.5 w-2.5 rounded-full" style={{ background: cl.color }} aria-hidden="true" />
            {cl.key === 'estate'
              ? <input id="estate-name" aria-label="Tên bất động sản" value={data.estateName} placeholder="Bất động sản" onChange={(e) => setData((d) => ({ ...d, estateName: e.target.value }))} className={`${CELL_L} font-semibold text-slate-700 min-w-0`} />
              : <span className="font-semibold text-slate-700 truncate" title={cl.label}>{cl.label}</span>}
            {cl.key in autos
              ? <Money v={autos[cl.key]} className="text-right font-bold text-slate-900" />
              : <NumInput id={`bs-${cl.key}`} ariaLabel={`Giá trị ${cl.label}`} value={entry[cl.key][0]} onChange={entry[cl.key][1]} className="w-full bg-slate-50 rounded-md border border-slate-200 px-1.5 py-0.5 text-right font-bold tnum outline-none focus:border-indigo-400 focus:bg-white" />}
            <span className="text-right tnum text-slate-600">{pcv(c.pct[cl.key], 0)}</span>
            <NumInput id={`tg-${cl.key}`} ariaLabel={`Mục tiêu ${cl.label}`} decimal value={data.targets[cl.key]} onChange={(v) => setTarget(cl.key, v)} className="w-full bg-slate-50 rounded-md border border-slate-200 px-1 py-0.5 text-right font-bold tnum outline-none focus:border-indigo-400 focus:bg-white" />
          </React.Fragment>
        ))}
      </div>
      <p className="text-[10px] text-slate-400 mt-1.5">Cổ phiếu, vàng, tiền gửi tự cộng từ bảng nhập danh mục bên dưới.</p>

      <div className="mt-4 pt-4 border-t border-slate-100">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
          <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Lệch so với mục tiêu</h3>
          <div role="tablist" aria-label="Chế độ khuyến nghị" className="flex gap-1">
            <TabButton small active={mode === 'rebalance'} onClick={() => setData((d) => ({ ...d, recMode: 'rebalance' }))}>Tái cân bằng</TabButton>
            <TabButton small active={mode === 'monthly'} onClick={() => setData((d) => ({ ...d, recMode: 'monthly' }))}>Từ thặng dư</TabButton>
          </div>
        </div>
        {mode === 'monthly' && <p className="text-[11px] text-slate-500 mb-2">Chia thặng dư <Money v={S} className="font-bold text-slate-700" />/tháng để mua thêm, không bán tài sản đang có.</p>}
        <ul className="space-y-1.5">
          {shown.map((r) => {
            let body, tone;
            if (mode === 'rebalance') {
              if (r.diff >= 1) { body = <>Cần bổ sung <Money v={r.diff} className="font-bold" /> {r.cl.label}</>; tone = 'bg-emerald-50 text-emerald-800'; }
              else if (r.diff <= -1) { body = <>Cần giảm <Money v={-r.diff} className="font-bold" /> {r.cl.label}</>; tone = 'bg-amber-50 text-amber-800'; }
              else { body = <>{r.cl.label} đúng mục tiêu</>; tone = 'bg-slate-50 text-slate-600'; }
            } else if (monthly[r.i] >= 1) {
              body = <>Mua thêm <Money v={monthly[r.i]} className="font-bold" />/tháng {r.cl.label}</>; tone = 'bg-emerald-50 text-emerald-800';
            } else {
              body = <>{r.cl.label} đã đủ, tạm dừng bổ sung</>; tone = 'bg-slate-50 text-slate-600';
            }
            return (
              <li key={r.cl.key} className={`flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-xs ${tone}`}>
                <span className="h-2 w-2 rounded-full shrink-0" style={{ background: r.cl.color }} aria-hidden="true" />
                <span className="flex-1 min-w-0">{body}</span>
              </li>
            );
          })}
          {shown.length === 0 && <li className="text-xs text-slate-400 py-2">Nhập giá trị tài sản để xem độ lệch.</li>}
        </ul>
        {mode === 'monthly' && S <= 0 && <p className="text-[11px] text-amber-700 mt-2">Thặng dư ≤ 0 nên chưa có khoản nào để phân bổ.</p>}
      </div>
    </Card>
  );
}

/* ---------- Nhận định tự động ---------- */
const TONES = {
  good: { dot: 'bg-emerald-500', head: 'text-emerald-700' },
  info: { dot: 'bg-indigo-500', head: 'text-indigo-700' },
  warn: { dot: 'bg-amber-500', head: 'text-amber-700' },
  bad: { dot: 'bg-rose-500', head: 'text-rose-700' },
};
function Insight({ items, title = 'Nhận định' }) {
  if (!items || items.length === 0) return null;
  return (
    <div className="mt-4 rounded-xl border border-indigo-100 bg-indigo-50/60 p-3">
      <div className="flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-wider text-indigo-700 mb-2"><Icon name="sparkles" size={13} />{title}</div>
      <ul className="space-y-1.5">
        {items.map((it, i) => (
          <li key={i} className="flex gap-2 text-xs leading-relaxed text-slate-700">
            <span className={`mt-1.5 h-2 w-2 rounded-full shrink-0 ${TONES[it.tone].dot}`} aria-hidden="true" />
            <span className="min-w-0"><b className={TONES[it.tone].head}>{it.head}</b> {it.body}</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

function topAssetInsights(items, c, data) {
  const out = [];
  if (!items.length || c.total <= 0) return out;
  const top = items[0];
  const t1 = (top.value / c.total) * 100;
  const t3 = (sum(items.slice(0, 3), (a) => a.value) / c.total) * 100;
  if (t1 >= 50) out.push({ tone: 'warn', head: 'Tập trung cao.', body: `${top.name} chiếm ${pcv(t1, 0)} tổng tài sản. Nếu tài sản này mất 10% giá trị, tổng tài sản giảm ${pcv(t1 / 10, 1)}.` });
  else if (t1 >= 30) out.push({ tone: 'info', head: 'Khá tập trung.', body: `${top.name} chiếm ${pcv(t1, 0)}, top 3 chiếm ${pcv(t3, 0)} tổng tài sản.` });
  else out.push({ tone: 'good', head: 'Phân tán tốt.', body: `Tài sản lớn nhất chỉ chiếm ${pcv(t1, 0)}, top 3 chiếm ${pcv(t3, 0)} tổng tài sản.` });
  if (data.estate > 0 && data.debts.fixed > 0) {
    const ltv = (data.debts.fixed / data.estate) * 100;
    out.push({ tone: ltv > 70 ? 'bad' : ltv > 50 ? 'warn' : 'info', head: 'Đòn bẩy bất động sản.', body: `Vay thế chấp bằng ${pcv(ltv, 0)} giá trị ${data.estateName || 'bất động sản'}. Phần sở hữu thực còn ${compact(data.estate - data.debts.fixed)}.` });
  }
  const liquid = c.actual.stock + c.actual.gold + c.actual.bank + c.actual.cash;
  const lp = (liquid / c.total) * 100;
  out.push({ tone: lp >= 40 ? 'good' : lp >= 20 ? 'info' : 'warn', head: 'Thanh khoản.', body: `${pcv(lp, 0)} tài sản (${compact(liquid)}) quy ra tiền được trong vài ngày, ${pcv(100 - lp, 0)} nằm ở tài sản khó bán nhanh.` });
  if (c.pct.recv >= 10) out.push({ tone: 'warn', head: 'Nợ phải đòi.', body: `Chiếm ${pcv(c.pct.recv, 0)} tổng tài sản. Nên chốt thời hạn thu hồi để tránh tiền bị treo.` });
  return out;
}

function spendingInsights(data, c) {
  const out = [];
  if (data.income > 0) {
    const sr = (c.surplus / data.income) * 100;
    if (c.surplus < 0) out.push({ tone: 'bad', head: 'Chi vượt thu.', body: `Mỗi tháng âm ${compact(-c.surplus)}, tài sản đang bị bào mòn. Cần cắt chi hoặc tăng thu ngay.` });
    else if (sr >= 30) out.push({ tone: 'good', head: 'Tiết kiệm xuất sắc.', body: `Giữ lại ${pcv(sr, 0)} thu nhập (${compact(c.surplus)}/tháng), vượt xa mốc 20% thường được khuyến nghị.` });
    else if (sr >= 20) out.push({ tone: 'good', head: 'Tiết kiệm tốt.', body: `Giữ lại ${pcv(sr, 0)} thu nhập (${compact(c.surplus)}/tháng), đạt mốc 20% khuyến nghị.` });
    else if (sr >= 10) out.push({ tone: 'warn', head: 'Tiết kiệm trung bình.', body: `Mới giữ lại ${pcv(sr, 0)} thu nhập. Cần thêm ${compact(data.income * 0.2 - c.surplus)}/tháng để chạm mốc 20%.` });
    else out.push({ tone: 'warn', head: 'Tiết kiệm thấp.', body: `Chỉ giữ lại ${pcv(sr, 0)} thu nhập (${compact(c.surplus)}/tháng). Nên rà lại nhóm chi lớn nhất.` });
  }
  if (data.budget > 0) {
    const u = (c.spent / data.budget) * 100;
    if (u > 100) out.push({ tone: 'bad', head: 'Vượt ngân sách.', body: `Chi ${compact(c.spent)} so với ngân sách ${compact(data.budget)}, vượt ${compact(c.spent - data.budget)} (${pcv(u - 100, 0)}).` });
    else if (u >= 85) out.push({ tone: 'warn', head: 'Sát ngân sách.', body: `Đã dùng ${pcv(u, 0)} ngân sách, còn ${compact(data.budget - c.spent)}.` });
    else out.push({ tone: 'good', head: 'Trong ngân sách.', body: `Đã dùng ${pcv(u, 0)} ngân sách, còn dư ${compact(data.budget - c.spent)}.` });
  }
  const cats = data.categories.map((k) => ({ name: k.name || '(chưa đặt tên)', v: catTotal(k) })).filter((k) => k.v > 0).sort((a, b) => b.v - a.v);
  if (cats.length >= 2 && c.spent > 0) {
    const sh = (cats[0].v / c.spent) * 100;
    out.push({ tone: sh >= 55 ? 'warn' : 'info', head: 'Nhóm chi lớn nhất.', body: `${cats[0].name} chiếm ${pcv(sh, 0)} chi tiêu (${compact(cats[0].v)}/tháng)${sh >= 55 ? ', nên xem có khoản nào cắt được.' : '.'}` });
  }
  if (c.spent > 0) {
    const m = (c.bankTotal + data.cash) / c.spent;
    out.push({ tone: m >= 6 ? 'good' : m >= 3 ? 'info' : 'warn', head: 'Quỹ dự phòng.', body: `Tiền gửi + tiền mặt đủ chi ${trim2(m)} tháng (chuẩn khuyến nghị 6 tháng).` });
    out.push({ tone: 'info', head: 'Tác động tới FIRE.', body: `Theo quy tắc 25 lần chi tiêu năm, mục tiêu FIRE là ${compact(c.spent * 300)}. Cắt thêm 1 triệu/tháng sẽ giảm mục tiêu này 300 triệu.` });
  }
  return out;
}

function portfolioInsights(tabKey, data, c) {
  const out = [];
  const cls = tabKey === 'stocks' ? 'stock' : tabKey === 'gold' ? 'gold' : 'bank';
  const rows = data[tabKey];
  const label = { stocks: 'cổ phiếu', gold: 'vàng', savings: 'tiền gửi' }[tabKey];
  if (rows.length === 0) return [{ tone: 'info', head: 'Chưa có dữ liệu.', body: `Thêm ${label} để xem nhận định về danh mục.` }];
  const gap = c.pct[cls] - data.targets[cls];
  const gapText = Math.abs(gap) <= 2 ? ', đang cân đối.' : gap < 0 ? `, thiếu ${pcv(-gap, 0)} (khoảng ${compact((-gap / 100) * c.total)}).` : `, vượt ${pcv(gap, 0)} (khoảng ${compact((gap / 100) * c.total)}).`;
  out.push({ tone: Math.abs(gap) <= 2 ? 'good' : 'warn', head: 'Tỷ trọng nhóm.', body: `${label.charAt(0).toUpperCase() + label.slice(1)} chiếm ${pcv(c.pct[cls], 0)} tổng tài sản so với mục tiêu ${pcv(data.targets[cls], 0)}${gapText}` });

  if (tabKey === 'stocks') {
    const list = rows.filter((r) => r.qty > 0 && r.price > 0);
    if (list.length === 0) return out;
    const tv = sum(list, (r) => r.qty * r.price), cost = sum(list, (r) => r.qty * r.cost), pnl = tv - cost;
    out.push({ tone: pnl >= 0 ? 'good' : 'warn', head: 'Hiệu suất.', body: `${pnl >= 0 ? 'Lãi' : 'Lỗ'} ${compact(Math.abs(pnl))} (${pcv(cost > 0 ? (pnl / cost) * 100 : 0)}) so với giá vốn ${compact(cost)}.` });
    const ranked = list.filter((r) => r.cost > 0).map((r) => ({ code: r.code || '?', p: ((r.price - r.cost) / r.cost) * 100 })).sort((a, b) => b.p - a.p);
    if (ranked.length >= 2) {
      const b = ranked[0], w = ranked[ranked.length - 1];
      out.push({ tone: w.p < 0 ? 'warn' : 'info', head: 'Mã nổi bật.', body: `${b.code} tốt nhất (${b.p >= 0 ? '+' : ''}${pcv(b.p)}), ${w.code} yếu nhất (${w.p >= 0 ? '+' : ''}${pcv(w.p)})${w.p < 0 ? '. Nên xem lại luận điểm đầu tư của mã này.' : '.'}` });
    }
    const top = list.slice().sort((a, b) => b.qty * b.price - a.qty * a.price)[0];
    const ts = ((top.qty * top.price) / tv) * 100;
    if (list.length >= 2 && ts >= 50) out.push({ tone: 'warn', head: 'Tập trung một mã.', body: `${top.code || '?'} chiếm ${pcv(ts, 0)} giá trị cổ phiếu, rủi ro riêng lẻ cao.` });
    const gaps = list.map((r) => { const a = ((r.qty * r.price) / tv) * 100; return { code: r.code || '?', a, t: r.target, d: a - r.target }; }).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    if (gaps[0] && Math.abs(gaps[0].d) >= 5) out.push({ tone: 'info', head: 'Lệch target.', body: `${gaps[0].code} đang ${pcv(gaps[0].a, 0)} so với target ${pcv(gaps[0].t, 0)}, nên ${gaps[0].d > 0 ? 'giảm' : 'tăng'} khoảng ${compact((Math.abs(gaps[0].d) / 100) * tv)}.` });
    const tsum = sum(rows, (r) => r.target);
    if (Math.abs(tsum - 100) > 0.001) out.push({ tone: 'warn', head: 'Tổng % target.', body: `Đang là ${pcv(tsum, 0)}, cần chỉnh về 100% để tính độ lệch chính xác.` });
    if (data.debts.risk > 0) out.push({ tone: 'warn', head: 'Đang vay margin.', body: `Dư nợ ${compact(data.debts.risk)} bằng ${pcv(c.stockTotal > 0 ? (data.debts.risk / c.stockTotal) * 100 : 0, 0)} giá trị cổ phiếu. Lãi vay sẽ ăn vào lợi nhuận khi thị trường đi ngang.` });
  } else if (tabKey === 'gold') {
    const list = rows.filter((r) => r.qty > 0 && r.price > 0);
    if (list.length === 0) return out;
    const qty = sum(list, (r) => r.qty), tv = sum(list, (r) => r.qty * r.price), cost = sum(list, (r) => r.qty * r.cost), pnl = tv - cost;
    out.push({ tone: pnl >= 0 ? 'good' : 'warn', head: 'Hiệu suất.', body: `Nắm giữ ${trim2(qty)} chỉ, ${pnl >= 0 ? 'lãi' : 'lỗ'} ${compact(Math.abs(pnl))} (${pcv(cost > 0 ? (pnl / cost) * 100 : 0)}) so với giá vốn.` });
    out.push({ tone: 'info', head: 'Giá bình quân.', body: `Giá vốn bình quân ${compact(cost / qty)}/chỉ, giá hiện tại bình quân ${compact(tv / qty)}/chỉ.` });
    out.push({ tone: 'info', head: 'Vai trò của vàng.', body: 'Vàng không sinh lãi, vai trò là giữ giá trị. Chỉ nên mua thêm khi tỷ trọng đang thấp hơn mục tiêu.' });
    const tsum = sum(rows, (r) => r.target);
    if (Math.abs(tsum - 100) > 0.001) out.push({ tone: 'warn', head: 'Tổng % target.', body: `Đang là ${pcv(tsum, 0)}, cần chỉnh về 100% để tính độ lệch chính xác.` });
  } else {
    const list = rows.filter((r) => r.principal > 0);
    if (list.length === 0) return out;
    const tp = sum(list, (r) => r.principal);
    const avg = sum(list, (r) => r.principal * r.rate) / tp;
    const interest = sum(list, (r) => (r.principal * r.rate * r.term) / 1200);
    out.push({ tone: 'info', head: 'Lãi suất bình quân.', body: `${pcv(avg, 2)}/năm trên ${compact(tp)} gốc, lãi dự kiến cả kỳ ${compact(interest)}.` });
    const m = list.map((r) => ({ r, d: daysBetween(TODAY, addMonths(parseISO(r.start), Math.round(r.term))) })).sort((a, b) => a.d - b.d)[0];
    const nm = m.r.bank || '(chưa đặt tên)';
    if (m.d < 0) out.push({ tone: 'bad', head: 'Đã quá hạn.', body: `Sổ ${nm} quá hạn ${-m.d} ngày, nên tất toán hoặc tái tục sớm.` });
    else if (m.d <= 30) out.push({ tone: 'warn', head: 'Sắp đáo hạn.', body: `Sổ ${nm} còn ${m.d} ngày, cần quyết định tái tục hay rút ra để đầu tư.` });
    else out.push({ tone: 'good', head: 'Lịch đáo hạn.', body: `Sổ gần nhất (${nm}) đáo hạn sau ${m.d} ngày, chưa cần xử lý gấp.` });
    const topB = list.slice().sort((a, b) => b.principal - a.principal)[0];
    const bs = (topB.principal / tp) * 100;
    if (list.length >= 2 && bs >= 60) out.push({ tone: 'warn', head: 'Tập trung ngân hàng.', body: `${topB.bank || '(chưa đặt tên)'} giữ ${pcv(bs, 0)} tiền gửi, nên cân nhắc chia sang ngân hàng khác.` });
  }
  return out;
}

                  <span className="text-xs text-slate-500">₫</span>
                </span>
              </label>
            </div>
          );
        })}
      </div>

      <div className="grid grid-cols-3 gap-2 mt-4">
        <RatioChip label="Nợ / Tài sản" value={pcv(debtPct, 0)} tone={debtTone} hint="Dưới 30% an toàn · 30-50% cần theo dõi · trên 50% rủi ro cao" />

  const items = [

    ...data.gold.map((r) => ({ name: `Vàng ${r.type || '(chưa đặt tên)'}`, type: 'Vàng', value: r.qty * r.price, color: CLASSES[1].color })),
    ...data.savings.map((r) => ({ name: `Sổ tiết kiệm ${r.bank || '(chưa đặt tên)'}`, type: 'Tiền gửi', value: r.principal, color: CLASSES[2].color })),
    { name: 'Tiền mặt', type: 'Tiền mặt', value: data.cash, color: CLASSES[3].color },
    { name: 'Nợ phải đòi', type: 'Nợ phải đòi', value: data.receivable, color: CLASSES[4].color },
    { name: data.estateName || 'Bất động sản', type: 'Bất động sản', value: data.estate, color: CLASSES[5].color },
  ].filter((a) => a.value > 0).sort((a, b) => b.value - a.value);
  const shown = items.slice(0, 6);
  const max = shown.length ? shown[0].value : 1;
  return (
    <Card title="Top tài sản lớn nhất" right={<span className="text-[11px] font-semibold text-slate-500 tnum">Tổng TS {compact(c.total)}</span>}>
      <div className="space-y-3.5">
        {shown.length === 0 && <p className="text-xs text-slate-400 text-center py-6">Chưa có tài sản. Nhập giá trị ở khối cơ cấu danh mục hoặc bảng nhập liệu.</p>}
        {shown.map((a, i) => (
          <ProgressRow key={a.name + i} title={a.name} sub={`${a.type} · ${pcv(c.total > 0 ? (a.value / c.total) * 100 : 0)} tổng TS`} valueText={compact(a.value)} valueTitle={vnd(a.value)} pct={(a.value / max) * 100} color={a.color}
            lead={<span className="h-6 w-6 shrink-0 rounded-full bg-slate-100 text-slate-600 text-[11px] font-extrabold grid place-items-center">{i + 1}</span>} />
        ))}
      </div>
      <Insight items={topAssetInsights(items, c, data)} />
    </Card>
  );
}

              <div className={`${ph ? 'w-32' : 'w-28'} shrink-0`}><NumInput id={`it-${it.id}-amt`} ariaLabel={`Số tiền ${it.name}`} value={it.amount} onChange={(v) => updItem(it.id, { amount: v })} className={`${CELL} bg-slate-50`} /></div>

          ))}
          <button type="button" onClick={addItem} className="inline-flex items-center gap-1 text-[11px] font-bold text-indigo-600 hover:text-indigo-800"><Icon name="plus" size={12} />Thêm khoản chi (tiền nhà, tiền điện, đổ xăng...)</button>

function projectGoal(g, surplus) {
  const rem = Math.max(0, g.target - g.current);
  const deadline = parseISO(g.deadline);
  const daysLeft = daysBetween(TODAY, deadline);
  if (g.target > 0 && rem === 0) return { kind: 'done', line: 'Đã đủ số tiền mục tiêu', rem };
  if (g.target <= 0) return { kind: 'none', line: 'Nhập số tiền mục tiêu để xem dự phóng', rem };
  if (surplus <= 0) return { kind: 'bad', line: 'Thặng dư ≤ 0, chưa thể tích lũy thêm', rem };
  const months = Math.ceil(rem / surplus);
  const line = `Nếu dồn 100% thặng dư (${compact(surplus)}/th), cần ${months} tháng`;
  if (daysLeft < 0) return { kind: 'bad', line, verdict: `Đã quá hạn ${Math.abs(daysLeft)} ngày`, rem };
  const monthsLeft = daysLeft / 30.4375;
  if (months <= monthsLeft) return { kind: 'ok', line, verdict: `Kịp hạn, dư ~${Math.max(0, Math.floor(monthsLeft - months))} tháng`, rem };
  return { kind: 'bad', line, verdict: `Không kịp hạn, trễ ~${Math.round(months - monthsLeft)} tháng. Cần ${compact(rem / Math.max(1, Math.floor(monthsLeft)))}/tháng`, rem };
}

function GoalsCard({ data, setData, c }) {
  const [editId, setEditId] = useState(null);
  const upd = (id, patch) => setData((d) => ({ ...d, goals: d.goals.map((g) => (g.id === id ? { ...g, ...patch } : g)) }));
  const del = (id) => setData((d) => ({ ...d, goals: d.goals.filter((g) => g.id !== id) }));
  const add = (preset = null) => {
    const id = uid();
    const newGoal = preset || {
      id,
      name: 'Mục tiêu mới',
      current: 0,
      target: 50000000,
      deadline: toISO(addMonths(TODAY, 12)),
      source: 'bank',
      priority: 2
    };
    setData((d) => ({ ...d, goals: [...d.goals, { ...newGoal, id }] }));
    if (!preset) setEditId(id);
  };

  // Số dư thực tế của từng nguồn tiền
  const poolAvail = {
    bank: c.bankTotal,
    cash: data.cash,
    gold: c.goldTotal,
    stock: c.stockTotal,
  };

  // Phân tích phân bổ nguồn tiền & phát hiện vượt ngân sách theo thứ tự ưu tiên
  const poolStats = {};
  const goalAllocStatus = {};

  ['bank', 'cash', 'gold', 'stock'].forEach((srcKey) => {
    const avail = poolAvail[srcKey] || 0;
    const goalsInSrc = data.goals
      .filter((g) => (g.source || 'bank') === srcKey)
      .slice()
      .sort((a, b) => (a.priority || 2) - (b.priority || 2) || daysBetween(TODAY, parseISO(a.deadline)) - daysBetween(TODAY, parseISO(b.deadline)));

    const totalUsed = sum(goalsInSrc, (g) => g.current);
    const balance = avail - totalUsed; // < 0 là bị âm nguồn tiền
    let remPool = avail;

    goalsInSrc.forEach((g) => {
      const covered = Math.max(0, Math.min(g.current, remPool));
      const uncovered = Math.max(0, g.current - covered);
      remPool = Math.max(0, remPool - g.current);
      goalAllocStatus[g.id] = { covered, uncovered, avail, totalUsed, balance };
    });

    poolStats[srcKey] = {
      key: srcKey,
      label: GOAL_SOURCES.find((s) => s.key === srcKey).label,
      avail,
      totalUsed,
      balance,
      count: goalsInSrc.length,
      goalsInSrc
    };
  });

  const overdrawnPools = Object.values(poolStats).filter((p) => p.balance < 0);

  // Hệ thống Gợi ý & Ưu tiên thông minh
  const suggestions = [];
  const emergencyTarget = c.spent > 0 ? c.spent * 6 : 42000000;
  const hasEmergencyGoal = data.goals.some((g) => /khẩn cấp|dự phòng/i.test(g.name));

  if (!hasEmergencyGoal) {
    suggestions.push({
      id: 'sug-emg',
      tone: 'amber',
      text: `Bạn chưa có Quỹ khẩn cấp (chuẩn 6 tháng chi tiêu = ${compact(emergencyTarget)}). Nên ưu tiên số 1 từ Tiền gửi NH để bảo vệ tài sản.`,
      actionLabel: '+ Tạo Quỹ khẩn cấp',
      onAction: () => add({
        name: 'Quỹ khẩn cấp 6 tháng',
        current: Math.min(c.bankTotal, emergencyTarget),
        target: emergencyTarget,
        deadline: toISO(addMonths(TODAY, 6)),
        source: 'bank',
        priority: 1
      })
    });
  }

  // Gợi ý xử lý nếu bị âm nguồn tiền
  overdrawnPools.forEach((p) => {
    const lowPrioGoals = p.goalsInSrc.filter((g) => goalAllocStatus[g.id]?.uncovered > 0);
    const names = lowPrioGoals.map((g) => `“${g.name}” (Ưu tiên ${g.priority || 2})`).join(', ');
    suggestions.push({
      id: `sug-over-${p.key}`,
      tone: 'rose',
      text: `Nguồn ${p.label} đang chỉ có ${compact(p.avail)} nhưng bạn phân bổ tới ${compact(p.totalUsed)} (Đang âm ${compact(Math.abs(p.balance))}). Khuyến nghị: Giảm số tiền hiện có hoặc lùi độ ưu tiên của ${names || 'mục tiêu phụ'}.`
    });
  });

  // Gợi ý phân bổ thặng dư hàng tháng
  const activeGoals = data.goals
    .filter((g) => g.target > g.current)
    .slice()
    .sort((a, b) => (a.priority || 2) - (b.priority || 2) || daysBetween(TODAY, parseISO(a.deadline)) - daysBetween(TODAY, parseISO(b.deadline)));

  if (c.surplus > 0 && activeGoals.length > 0) {
    const topG = activeGoals[0];
    const rem = topG.target - topG.current;
    const mNeed = Math.ceil(rem / c.surplus);
    suggestions.push({
      id: 'sug-surplus',
      tone: 'indigo',
      text: `Gợi ý ưu tiên thặng dư (+${compact(c.surplus)}/tháng): Nên dồn trước cho “${topG.name}” (Ưu tiên ${topG.priority || 2}, còn thiếu ${compact(rem)}). Chỉ mất khoảng ${mNeed} tháng để hoàn thành dứt điểm.`
    });
  } else if (c.surplus <= 0 && activeGoals.length > 0) {
    suggestions.push({
      id: 'sug-nosurplus',
      tone: 'amber',
      text: `Thặng dư tháng đang ≤ 0 (${compact(c.surplus)}). Bạn cần cắt giảm chi tiêu hoặc tăng thu nhập để có dòng tiền nuôi ${activeGoals.length} mục tiêu đang chạy.`
    });
  }

  // Gợi ý tiền nhàn rỗi chưa gán mục tiêu
  const freeBank = Math.max(0, poolStats.bank.balance);
  const freeCash = Math.max(0, poolStats.cash.balance);
  if ((freeBank + freeCash) >= 10000000 && activeGoals.length > 0) {
    const topG = activeGoals[0];
    suggestions.push({
      id: 'sug-idle',
      tone: 'emerald',
      text: `Bạn đang còn ${compact(freeBank + freeCash)} vốn thanh khoản chưa gán mục tiêu (${compact(freeBank)} Tiền gửi NH, ${compact(freeCash)} Tiền mặt). Có thể phân bổ thêm vào “${topG.name}” để rút ngắn thời gian.`
    });
  }

  return (
    <Card title="Tiến độ mục tiêu & Phân bổ nguồn tiền" right={<IconBtn icon="plus" label="Thêm mục tiêu" onClick={() => add()} />}>
      {/* Bảng kiểm tra số dư nguồn tiền */}
      <div className="mb-3 rounded-xl border border-slate-200 bg-slate-50 p-2.5">
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500">Kiểm tra nguồn vốn cấp cho mục tiêu</span>
          <span className="text-[10px] font-semibold text-slate-400">Đã gán / Thực có</span>
        </div>
        <div className="grid grid-cols-2 gap-1.5">
          {['bank', 'cash', 'gold', 'stock'].map((k) => {
            const st = poolStats[k];
            if (st.avail === 0 && st.totalUsed === 0) return null;
            const isOver = st.balance < 0;
            return (
              <div key={k} className={`rounded-lg border px-2 py-1.5 text-xs ${isOver ? 'bg-rose-50 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-700'}`}>
                <div className="flex items-center justify-between font-bold">
                  <span className="truncate">{st.label}</span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${isOver ? 'bg-rose-600 text-white' : 'bg-emerald-50 text-emerald-700'}`}>
                    {isOver ? `Âm ${compact(Math.abs(st.balance))}` : `Dư ${compact(st.balance)}`}
                  </span>
                </div>
                <div className="text-[11px] tnum mt-0.5 text-slate-500">
                  Dùng <b className={isOver ? 'text-rose-700' : 'text-slate-800'}>{compact(st.totalUsed)}</b> / {compact(st.avail)}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Cảnh báo đỏ nếu nhiều mục tiêu dùng chung nguồn làm âm tiền */}
      {overdrawnPools.length > 0 && (
        <div className="mb-3 rounded-xl border-2 border-rose-500 bg-rose-50 p-3 text-xs text-rose-900" role="alert">
          <div className="flex items-center gap-1.5 font-extrabold text-rose-700 uppercase tracking-wide text-[11px]">
            <Icon name="alert" size={15} /> Cảnh báo vượt ngân sách nguồn tiền!
          </div>
          {overdrawnPools.map((p) => (
            <p key={p.key} className="mt-1 leading-relaxed">
              • Nguồn <b>{p.label}</b> chỉ có thực tế <b>{compact(p.avail)}</b> nhưng tổng các mục tiêu lấy từ nguồn này lên tới <b>{compact(p.totalUsed)}</b> (Đang bị âm <b>{compact(Math.abs(p.balance))}</b>). Hãy chọn mục tiêu quan trọng làm <b>Ưu tiên 1</b> hoặc giảm số tiền phân bổ!
            </p>
          ))}
        </div>
      )}

      {/* Khối Cố vấn & Gợi ý mục tiêu */}
      {suggestions.length > 0 && (
        <div className="mb-3 rounded-xl border border-indigo-100 bg-indigo-50/70 p-3 space-y-2">
          <div className="flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-wider text-indigo-700">
            <Icon name="sparkles" size={14} /> Gợi ý &amp; Ưu tiên dòng tiền
          </div>
          {suggestions.map((s) => (
            <div key={s.id} className="text-[11px] leading-relaxed text-slate-700 flex flex-wrap items-center justify-between gap-2 bg-white/80 rounded-lg px-2.5 py-1.5 border border-indigo-100/80">
              <span className="flex-1 min-w-[180px]">{s.text}</span>
              {s.onAction && (
                <button type="button" onClick={s.onAction} className="shrink-0 text-[10px] font-bold px-2.5 py-1 rounded-md bg-indigo-600 text-white hover:bg-indigo-500">
                  {s.actionLabel}
                </button>
              )}
            </div>
          ))}
        </div>
      )}

      {/* Danh sách mục tiêu */}
      <div className="space-y-3">
        {data.goals.length === 0 && <p className="text-xs text-slate-400 text-center py-4">Chưa có mục tiêu. Bấm + để thêm.</p>}
        {data.goals.map((g) => {
          const p = g.target > 0 ? (g.current / g.target) * 100 : 0;
          const pj = projectGoal(g, c.surplus);
          const good = pj.kind === 'done' || pj.kind === 'ok';
          const editing = editId === g.id;
          const srcObj = GOAL_SOURCES.find((s) => s.key === (g.source || 'bank')) || GOAL_SOURCES[0];
          const prioObj = PRIORITIES.find((pr) => pr.v === (g.priority || 2)) || PRIORITIES[1];
          const alloc = goalAllocStatus[g.id];
          const isShortfall = alloc && alloc.uncovered > 0;

          return (
            <article key={g.id} className={`rounded-xl border p-3 transition ${isShortfall ? 'border-rose-400 bg-rose-50/40' : 'border-slate-200 bg-slate-50/60'}`}>
              <div className="flex items-center gap-1.5">
                {editing
                  ? <input id={`goal-${g.id}-name`} aria-label="Tên mục tiêu" value={g.name} onChange={(e) => upd(g.id, { name: e.target.value })} className={`${CELL_L} flex-1 min-w-0 font-bold bg-white border-slate-200`} />
                  : <h3 className="flex-1 min-w-0 truncate text-sm font-bold text-slate-800">{g.name}</h3>}
                <span className={`text-sm font-extrabold tnum ${p >= 100 ? 'text-emerald-600' : 'text-indigo-700'}`}>{pcv(p, 0)}</span>
                <IconBtn icon={editing ? 'check' : 'edit'} label={editing ? 'Xong' : 'Sửa mục tiêu'} onClick={() => setEditId(editing ? null : g.id)} />
                <IconBtn tone="rose" icon="trash" label={`Xóa mục tiêu ${g.name}`} onClick={() => del(g.id)} />
              </div>

              {/* Nhãn Nguồn tiền & Độ ưu tiên nhanh */}
              <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                <select
                  aria-label="Nguồn vốn"
                  value={g.source || 'bank'}
                  onChange={(e) => upd(g.id, { source: e.target.value })}
                  className={`max-w-full min-w-0 text-[10px] font-bold px-2 py-0.5 rounded-md border cursor-pointer outline-none ${srcObj.bg}`}
                >
                  {GOAL_SOURCES.map((s) => (
                    <option key={s.key} value={s.key}>Nguồn: {s.label}</option>
                  ))}
                </select>

                <select
                  aria-label="Mức độ ưu tiên"
                  value={g.priority || 2}
                  onChange={(e) => upd(g.id, { priority: Number(e.target.value) })}
                  className={`max-w-full min-w-0 text-[10px] font-bold px-2 py-0.5 rounded-md border cursor-pointer outline-none ${prioObj.badge}`}
                >
                  {PRIORITIES.map((pr) => (
                    <option key={pr.v} value={pr.v}>{pr.label}</option>
                  ))}
                </select>
              </div>

              <div className="mt-2"><Bar pct={p} color={isShortfall ? '#e11d48' : p >= 100 ? '#16a34a' : '#4f46e5'} label={g.name} /></div>

              {editing ? (
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-2.5">
                  <div>
                    <label htmlFor={`goal-${g.id}-cur`} className="text-[10px] font-bold text-slate-500">Phân bổ hiện có</label>
                    <NumInput id={`goal-${g.id}-cur`} value={g.current} onChange={(v) => upd(g.id, { current: v })} className={`${CELL} bg-white border-slate-200 font-bold`} />
                  </div>
                  <div>
                    <label htmlFor={`goal-${g.id}-tgt`} className="text-[10px] font-bold text-slate-500">Mục tiêu cần</label>
                    <NumInput id={`goal-${g.id}-tgt`} value={g.target} onChange={(v) => upd(g.id, { target: v })} className={`${CELL} bg-white border-slate-200 font-bold`} />
                  </div>
                  <div>
                    <label htmlFor={`goal-${g.id}-due`} className="text-[10px] font-bold text-slate-500">Hạn hoàn thành</label>
                    <input id={`goal-${g.id}-due`} type="date" value={g.deadline} onChange={(e) => upd(g.id, { deadline: e.target.value || g.deadline })} className={`${CELL_L} bg-white border-slate-200`} />
                  </div>
                </div>
              ) : (
                <div className="flex flex-wrap items-center justify-between gap-1 text-[11px] text-slate-500 mt-2 tnum">
                  <span>Đang gán: <Money v={g.current} className="font-bold text-slate-800" /> / <Money v={g.target} className="font-bold text-slate-800" /></span>
                  <span>Hạn {fmtDate(parseISO(g.deadline))}</span>
                </div>
              )}

              {/* Cảnh báo nếu mục tiêu này bị thiếu hụt do nguồn tiền đã cấp cho mục tiêu ưu tiên cao hơn */}
              {isShortfall && (
                <div className="mt-2 rounded-md bg-rose-600 text-white px-2.5 py-1.5 text-[11px] font-semibold leading-snug">
                  ⚠️ Thiếu hụt {compact(alloc.uncovered)} từ nguồn {srcObj.label}! (Sau khi cấp cho mục tiêu ưu tiên cao hơn, nguồn này chỉ còn đủ {compact(alloc.covered)} cho mục tiêu này).
                </div>
              )}

              <p className={`text-[11px] mt-2 leading-snug rounded-md px-2 py-1.5 ${good ? 'bg-emerald-50 text-emerald-800' : pj.kind === 'bad' ? 'bg-amber-50 text-amber-900' : 'bg-slate-100 text-slate-600'}`} title={`Còn thiếu ${vnd(pj.rem)} · thặng dư ${vnd(c.surplus)}/tháng`}>
                {pj.line}{pj.verdict && <b className="block">{pj.verdict}</b>}
              </p>
            </article>
          );
        })}
      </div>
    </Card>
  );
}

const VIEWS = [
  { k: 'pc', label: 'PC View', icon: 'monitor' },
  { k: 'phone', label: 'iPhone View', icon: 'phone' },
  { k: 'auto', label: 'Auto', icon: 'auto' },
];
function ViewSwitcher({ view, setView, compact = false }) {
  return (
    <div role="group" aria-label="Chế độ xem" className="inline-flex p-1 rounded-xl bg-white border border-slate-200 shadow-sm">
      {VIEWS.map((v) => (
        <button key={v.k} type="button" onClick={() => setView(v.k)} aria-pressed={view === v.k} aria-label={v.label} title={v.label}
          className={`inline-flex items-center gap-1.5 text-xs font-bold ${compact ? 'px-2 py-1.5' : 'px-3 py-2'} rounded-lg transition whitespace-nowrap ${view === v.k ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
          <Icon name={v.icon} size={14} />{!compact && v.label}
        </button>
      ))}
    </div>
  );
}

function loadView() {
  try { const v = localStorage.getItem(VIEW_KEY); return v === 'pc' || v === 'phone' ? v : 'auto'; } catch (e) { return 'auto'; }
}

function useClock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  return now;
}

function useNarrow() {
  const q = '(max-width: 600px)';
  const [m, setM] = useState(() => typeof window.matchMedia === 'function' && window.matchMedia(q).matches);
  useEffect(() => {
    if (typeof window.matchMedia !== 'function') return undefined;
    const mq = window.matchMedia(q);
    const h = () => setM(mq.matches);
    h();
    if (mq.addEventListener) mq.addEventListener('change', h); else mq.addListener(h);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', h); else mq.removeListener(h); };
  }, []);
  return m;
}

function SyncBadge({ sync, onRetry }) {
  const m = {
    loading: { dot: 'bg-slate-400 animate-pulse', txt: 'Đang tải dữ liệu…', cls: 'text-slate-500' },
    ready: { dot: 'bg-emerald-500', txt: 'Đã đồng bộ Supabase', cls: 'text-emerald-700' },
    saving: { dot: 'bg-amber-400 animate-pulse', txt: 'Đang lưu…', cls: 'text-amber-700' },
    error: { dot: 'bg-rose-500', txt: 'Lỗi đồng bộ, bấm để thử lại', cls: 'text-rose-700' },
    offline: { dot: 'bg-slate-400', txt: 'Chỉ lưu trên máy này', cls: 'text-slate-500' },
  }[sync];
  const inner = (<><span className={`h-2 w-2 rounded-full shrink-0 ${m.dot}`} aria-hidden="true" /><span className="truncate">{m.txt}</span></>);
  const cls = `inline-flex items-center gap-1.5 text-[11px] font-semibold min-w-0 ${m.cls}`;
  return sync === 'error'
    ? <button type="button" onClick={onRetry} className={cls}>{inner}</button>
    : <span className={cls} role="status">{inner}</span>;
}

function StatusBar({ now }) {
  const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  return (
    <div className="shrink-0 h-11 flex items-end justify-between px-8 pb-1 text-[13px] font-bold text-slate-900 bg-white" aria-hidden="true">
      <span className="tnum">{t}</span>
      <span className="inline-flex h-2.5 w-[22px] rounded-[3px] border border-slate-900 p-px"><span className="block h-full w-4/5 rounded-[1px] bg-slate-900" /></span>
    </div>
  );
}

const PTABS = [
  { k: 'overview', label: 'Tổng quan', icon: 'home' },
  { k: 'portfolio', label: 'Danh mục', icon: 'pie' },
  { k: 'cash', label: 'Chi tiêu', icon: 'wallet' },
  { k: 'goals', label: 'Mục tiêu', icon: 'target' },
];
const PTITLES = { overview: 'Tổng quan gia sản', portfolio: 'Danh mục đầu tư', cash: 'Chi tiêu & tài sản', goals: 'Mục tiêu tài chính' };

function App() {
  const [view, setView] = useState(loadView);
  const [data, setDataState] = useState(loadLocalData);
  const [loaded, setLoaded] = useState(false);
  const [sync, setSync] = useState(window.supabaseClient ? 'loading' : 'offline');
  const [live, setLive] = useState(false);
  const [tab, setTab] = useState('overview');
  const now = useClock();
  const narrow = useNarrow();
  const client = window.supabaseClient;
  const dataRef = useRef(data);
  dataRef.current = data;
  const lastSaved = useRef('');
  const saveTimer = useRef(null);
  const scrollRef = useRef(null);

  const eff = view === 'auto' ? (narrow ? 'phone' : 'auto') : view;
  const isPhone = eff === 'phone';
  const framed = isPhone && !narrow;

  // ĐỌC DỮ LIỆU TỪ SUPABASE
  const loadRemote = useCallback(async () => {
    if (!client) return;
    try {
      const { data: row, error } = await client.from('wealthos_data').select('json_data').eq('id', 1).maybeSingle();
      if (error) throw error;
      if (row && row.json_data) {
        const next = normalizeData(row.json_data);
        lastSaved.current = JSON.stringify(next);
        setDataState(next);
      }
      setLoaded(true);
      setSync('ready');
    } catch (e) {
      console.error('Lỗi tải dữ liệu Supabase:', e);
      setSync('error');
    }
  }, [client]);

  // GHI LÊN SUPABASE (chỉ khi đã đọc thành công, tránh ghi đè dữ liệu thật bằng dữ liệu mặc định)
  const flush = useCallback(async () => {
    if (!client || !loaded) return;
    const payload = dataRef.current;
    const str = JSON.stringify(payload);
    if (str === lastSaved.current) return;
    clearTimeout(saveTimer.current);
    setSync('saving');
    try {
      const { error } = await client.from('wealthos_data').upsert({ id: 1, json_data: payload });
      if (error) throw error;
      lastSaved.current = str;
      setSync('ready');
    } catch (err) {
      console.error('Lỗi lưu Supabase:', err);
      setSync('error');
    }
  }, [client, loaded]);

  useEffect(() => { loadRemote(); }, [loadRemote]);
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { return; } }, [data]);
  useEffect(() => {
    if (!loaded || !client) return undefined;
    if (JSON.stringify(data) === lastSaved.current) return undefined;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(flush, 1200);
    return () => clearTimeout(saveTimer.current);
  }, [data, loaded, client, flush]);
  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState === 'hidden') { flush(); return; }
      if (!loaded || JSON.stringify(dataRef.current) === lastSaved.current) loadRemote();
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [flush, loadRemote, loaded]);
  const retry = () => { if (loaded) flush(); else loadRemote(); };

  const setData = useCallback((fn) => { setDataState((prev) => fn(prev)); }, []);
  const c = useMemo(() => compute(data), [data]);

  useEffect(() => { try { localStorage.setItem(VIEW_KEY, view); } catch (e) { return; } }, [view]);
  useEffect(() => {
    if (!live) return undefined;
    const t = setInterval(() => { setDataState((d) => ({ ...d, stocks: d.stocks.map(simulatePrice) })); }, 4000);
    return () => clearInterval(t);
  }, [live]);
  useEffect(() => {
    if (!isPhone) return undefined;
    document.documentElement.classList.add('lock');
    document.body.classList.add('lock');
    return () => { document.documentElement.classList.remove('lock'); document.body.classList.remove('lock'); };
  }, [isPhone]);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [tab, isPhone]);

  const clock = [now.getHours(), now.getMinutes(), now.getSeconds()].map((x) => String(x).padStart(2, '0')).join(':');
  const outer = V(eff, 'w-full', 'w-full overflow-x-auto thin-scroll', 'w-full overflow-x-hidden');
  const frame = V(eff, '', 'min-w-[1200px] p-4', 'max-w-[1600px] mx-auto p-3 sm:p-4 overflow-x-hidden');
  const root = `grid gap-4 ${V(eff, 'grid-cols-1', 'grid-cols-12', 'grid-cols-1 lg:grid-cols-12')}`;
  const tier = V(eff, '', 'col-span-12', 'lg:col-span-12');
  const kpiGrid = V(eff, 'grid-cols-2', 'grid-cols-[1.4fr_1fr_1fr_1fr_1.2fr]', 'grid-cols-2 lg:grid-cols-[1.4fr_1fr_1fr_1fr_1.2fr]');
  const netSpan = V(eff, 'col-span-2', '', 'col-span-2 lg:col-span-1');
  const midGrid = V(eff, 'grid-cols-1', 'grid-cols-[35fr_65fr]', 'grid-cols-1 lg:grid-cols-[35fr_65fr]');
  const botGrid = V(eff, 'grid-cols-1', 'grid-cols-3', 'grid-cols-1 lg:grid-cols-3');
  const head = V(eff, 'flex-col', 'flex-row items-end', 'flex-col lg:flex-row lg:items-end');

  const kpiBlock = (
    <div className={`${tier} grid gap-3 ${kpiGrid}`}>
      <Kpi small={isPhone} dark className={netSpan} label="Tổng tài sản ròng" sub={vnd(c.net)}><span title={vnd(c.net)}>{big(c.net)}</span></Kpi>
      <Kpi small={isPhone} label="Tổng tài sản" sub={vnd(c.total)}><span title={vnd(c.total)}>{big(c.total)}</span></Kpi>
      <Kpi small={isPhone} label="Tổng nợ" sub={`Chiếm ${pcv(c.total > 0 ? (c.debt / c.total) * 100 : 0)} tổng tài sản`} bar={c.total > 0 ? (c.debt / c.total) * 100 : 0} barColor="#f97316"><span className="text-orange-600" title={vnd(c.debt)}>{big(c.debt)}</span></Kpi>
      <Kpi small={isPhone} className={isPhone ? 'col-span-2' : ''} label="Dòng tiền thặng dư (tháng)" sub={`Thu ${compact(data.income)} − chi ${compact(c.spent)} · tiết kiệm ${pcv(data.income > 0 ? (c.surplus / data.income) * 100 : 0)}`}>
        <span className={c.surplus >= 0 ? 'text-emerald-600' : 'text-rose-600'} title={vnd(c.surplus)}>{c.surplus >= 0 ? '+ ' : '− '}{fixed2(Math.abs(c.surplus) / 1e6)} triệu</span>
      </Kpi>
      <Kpi small={isPhone} className={isPhone ? 'col-span-2' : ''} label="Mức độ tự do tài chính (FIRE)" sub={data.fireTarget > 0 ? `Mục tiêu FIRE ${compact(c.fireTarget)}` : `Tự động: 25 × chi tiêu năm = ${compact(c.fireTarget)}`} bar={c.firePct} barColor="#4f46e5"
        extra={
          <div className="flex items-center gap-1.5 mt-2">
            <label htmlFor="fire-target" className="text-[10px] font-bold text-slate-500 shrink-0">Mục tiêu FIRE</label>
            <NumInput id="fire-target" blankZero value={data.fireTarget} placeholder="Tự động" onChange={(v) => setData((d) => ({ ...d, fireTarget: v }))} className="w-full min-w-0 rounded-md border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-xs font-bold tnum text-right outline-none focus:border-indigo-400 focus:bg-white" />
          </div>
        }>
        <span className="text-indigo-700">{pcv(c.firePct, c.firePct < 10 ? 1 : 0)} <span className="text-sm font-bold text-slate-500">mục tiêu</span></span>
      </Kpi>
    </div>
  );
  const allocation = <AllocationCard data={data} setData={setData} c={c} view={eff} />;
  const balance = <BalanceCard data={data} setData={setData} c={c} />;
  const portfolio = <Portfolio data={data} setData={setData} c={c} live={live} setLive={setLive} view={eff} />;
  const topAssets = <TopAssetsCard data={data} c={c} />;
  const spending = <SpendingCard data={data} setData={setData} c={c} view={eff} />;
  const goals = <GoalsCard data={data} setData={setData} c={c} />;

  if (isPhone) {
    const shell = (
      <div className="flex flex-col h-full w-full bg-slate-50 overflow-hidden">
        {framed && <StatusBar now={now} />}
        <header className="shrink-0 bg-white border-b border-slate-200 px-4 pb-2.5 flex items-center justify-between gap-2" style={{ paddingTop: framed ? 4 : 'max(10px, env(safe-area-inset-top, 0px))' }}>
          <div className="min-w-0">
            <p className="text-[10px] font-bold tracking-widest text-indigo-600">WEALTHOS PRO</p>
            <h1 className="text-[15px] leading-tight font-extrabold text-slate-900 truncate">{PTITLES[tab]}</h1>
            <SyncBadge sync={sync} onRetry={retry} />
          </div>
          <ViewSwitcher view={view} setView={setView} compact />
        </header>
        <main ref={scrollRef} className="app-scroll flex-1 min-h-0 px-3 py-3">
          {tab === 'overview' && <div className="space-y-3">{kpiBlock}{allocation}{balance}</div>}
          {tab === 'portfolio' && <div className="space-y-3">{portfolio}</div>}
          {tab === 'cash' && <div className="space-y-3">{spending}{topAssets}</div>}
          {tab === 'goals' && <div className="space-y-3">{goals}</div>}
          <div className="h-2" />
        </main>
        <nav aria-label="Điều hướng" className="shrink-0 grid grid-cols-4 bg-white border-t border-slate-200" style={{ paddingBottom: framed ? 10 : 'max(6px, env(safe-area-inset-bottom, 0px))' }}>
          {PTABS.map((t) => (
            <button key={t.k} type="button" onClick={() => setTab(t.k)} aria-current={tab === t.k ? 'page' : undefined}
              className={`flex flex-col items-center gap-0.5 pt-2 pb-1 text-[10px] font-bold ${tab === t.k ? 'text-indigo-600' : 'text-slate-400'}`}>
              <Icon name={t.icon} size={20} />{t.label}
            </button>
          ))}
        </nav>
      </div>
    );
    if (!framed) return <div className="fixed inset-0 w-full">{shell}</div>;
    return (
      <div className="min-h-screen w-full grid place-items-center bg-slate-200 p-4 overflow-hidden">
        <div className="relative rounded-[56px] bg-slate-900 p-[10px] shadow-2xl" style={{ width: 410 }}>
          <div className="relative overflow-hidden rounded-[46px] bg-white" style={{ height: 'min(830px, calc(100dvh - 56px))', transform: 'translateZ(0)' }}>
            <div className="absolute left-1/2 top-2 z-40 h-[26px] w-[92px] -translate-x-1/2 rounded-full bg-black" aria-hidden="true" />
            {shell}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 p-2 sm:p-4 overflow-x-hidden">
      <div className={outer}>
        <div className={frame}>
          <div className={root}>
            <header className={`${tier} flex ${head} justify-between gap-3`}>
              <div className="min-w-0">
                <p className="inline-flex items-center gap-1.5 text-[11px] font-bold tracking-widest text-indigo-600"><Icon name="layers" size={14} />WEALTHOS PRO · QUẢN LÝ GIA SẢN &amp; TỰ DO TÀI CHÍNH</p>
                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 mt-1">BÁO CÁO TỔNG QUAN GIA SẢN</h1>
                <p className="text-xs text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                  <SyncBadge sync={sync} onRetry={retry} />
                  <span>VNĐ · <span className="tnum">{clock}</span></span>
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <ViewSwitcher view={view} setView={setView} />
              </div>
            </header>

            {kpiBlock}

            <div className={`${tier} grid gap-4 items-start ${midGrid}`}>
              {allocation}
              {balance}
            </div>

            <div className={tier}>{portfolio}</div>

            <div className={`${tier} grid gap-4 items-start ${botGrid}`}>
              {topAssets}
              {spending}
              {goals}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
