function App() {
  const [view, setView] = useState(loadView);
  const [registry, setRegistry] = useState({ version: 3, users: {} });
  const [currentUserEmail, setCurrentUserEmail] = useState('');
  const [workspaceMode, setWorkspaceMode] = useState('user1'); // 'user1' | 'user2' | 'combined' | 'admin_inspect'
  const [inspectEmail, setInspectEmail] = useState('');
  const [authStatus, setAuthStatus] = useState('checking'); // 'checking' | 'login' | 'authenticated'
  const [legacyCipher, setLegacyCipher] = useState(null);
  const [legacyPlain, setLegacyPlain] = useState(null);
  const [showAdminModal, setShowAdminModal] = useState(false);

  const [sync, setSync] = useState(window.supabaseClient ? 'loading' : 'offline');
  const [live, setLive] = useState(false);
  const [tab, setTab] = useState('overview');
  const [history, setHistory] = useState(() => loadHistory());
  const [dark, setDark] = useDarkMode();

  const narrow = useNarrow();
  const client = window.supabaseClient;
  const regRef = useRef(registry);
  regRef.current = registry;
  const lastSaved = useRef('');
  const saveTimer = useRef(null);
  const scrollRef = useRef(null);

  const eff = view === 'auto' ? (narrow ? 'phone' : 'auto') : view;
  const isPhone = eff === 'phone';
  const framed = isPhone && !narrow;

  // 1. TẢI DỮ LIỆU ĐÁM MÂY SUPABASE & KIỂM TRA PHIÊN ĐĂNG NHẬP
  const loadRemote = useCallback(async () => {
    if (window.location.search.includes('error=') || window.location.hash.includes('error=')) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    let loadedReg = null;
    if (client) {
      try {
        const { data: row, error } = await client.from('wealthos_data').select('json_data').eq('id', 1).maybeSingle();
        if (error) throw error;
        if (row && row.json_data) {
          const jd = row.json_data;
          if (jd.v3_vault) {
            const bytes = CryptoJS.AES.decrypt(jd.v3_vault, CLOUD_SECRET);
            const str = bytes.toString(CryptoJS.enc.Utf8);
            if (str) loadedReg = JSON.parse(str);
          } else if (jd.version === 3 && jd.users) {
            loadedReg = jd;
          } else if (jd.ciphertext) {
            setLegacyCipher(jd.ciphertext);
          } else {
            setLegacyPlain(normalizeData(jd));
          }
        }
        setSync('ready');
      } catch (e) {
        console.error('Lỗi tải dữ liệu Supabase:', e);
        setSync('error');
      }
    }

    if (!loadedReg) {
      try {
        const localRaw = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (localRaw && localRaw.v3_vault) {
          const bytes = CryptoJS.AES.decrypt(localRaw.v3_vault, CLOUD_SECRET);
          loadedReg = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
        }
      } catch (err) {}
    }

    // Kiểm tra phiên Google OAuth trên Supabase
    let oauthUser = null;
    if (client) {
      try {
        const { data: sessionData } = await client.auth.getSession();
        oauthUser = sessionData?.session?.user || null;
      } catch (err) {}
    }

    if (oauthUser && oauthUser.email) {
      const gEmail = cleanEmail(oauthUser.email);
      const gName = oauthUser.user_metadata?.full_name || gEmail.split('@')[0];
      const baseUsers = (loadedReg && loadedReg.users) ? loadedReg.users : {};
      const hasAnyUser = Object.keys(baseUsers).length > 0;

      const nextReg = {
        version: 3,
        users: {
          ...baseUsers,
          [gEmail]: baseUsers[gEmail] || {
            email: gEmail,
            name: gName,
            pinHash: hashPin('123456'),
            isAdmin: !hasAnyUser,
            partnerEmail: '',
            createdAt: toISO(TODAY),
            data: !hasAnyUser && legacyPlain ? legacyPlain : makeDefaultData(),
          }
        }
      };
      lastSaved.current = JSON.stringify(nextReg);
      setRegistry(nextReg);
      setCurrentUserEmail(gEmail);
      sessionStorage.setItem(SESSION_KEY, gEmail);
      setAuthStatus('authenticated');
      return;
    }

    if (loadedReg && loadedReg.users) {
      lastSaved.current = JSON.stringify(loadedReg);
      setRegistry(loadedReg);
      const savedSession = cleanEmail(sessionStorage.getItem(SESSION_KEY) || '');
      if (savedSession && loadedReg.users[savedSession]) {
        setCurrentUserEmail(savedSession);
        setAuthStatus('authenticated');
      } else {
        setAuthStatus('login');
      }
    } else {
      setAuthStatus('login');
    }
  }, [client, legacyPlain]);

  useEffect(() => {
    loadRemote();
    if (!client) return undefined;
    const { data: authListener } = client.auth.onAuthStateChange((event, session) => {
      if (session && session.user && session.user.email) {
        const gEmail = cleanEmail(session.user.email);
        const gName = session.user.user_metadata?.full_name || gEmail.split('@')[0];
        setRegistry((prev) => {
          const hasAnyUser = Object.keys(prev.users || {}).length > 0;
          if (prev.users && prev.users[gEmail]) return prev;
          return {
            version: 3,
            users: {
              ...(prev.users || {}),
              [gEmail]: {
                email: gEmail,
                name: gName,
                pinHash: hashPin('123456'),
                isAdmin: !hasAnyUser,
                partnerEmail: '',
                createdAt: toISO(TODAY),
                data: makeDefaultData(),
              }
            }
          };
        });
        setCurrentUserEmail(gEmail);
        sessionStorage.setItem(SESSION_KEY, gEmail);
        setAuthStatus('authenticated');
      }
    });

  const handleGmailAuth = ({ mode, email, name, pin, oldPin }) => {
    const users = registry.users || {};
    const hasUsers = Object.keys(users).length > 0;

    if (mode === 'login') {
      const u = users[email];
      if (!u) return { ok: false, msg: 'Gmail này chưa được đăng ký. Vui lòng chuyển sang tab "Đăng ký Gmail mới".' };

      setCurrentUserEmail(email);
      sessionStorage.setItem(SESSION_KEY, email);
      setWorkspaceMode('user1');
      setAuthStatus('authenticated');
      return { ok: true };

      if (users[email]) return { ok: false, msg: 'Gmail này đã tồn tại trên hệ thống. Vui lòng chọn Đăng nhập.' };
      let initialData = hasUsers ? makeEmptyUserData() : makeDefaultData();

      if (!hasUsers) {
        if (legacyPlain) {
          initialData = legacyPlain;
        } else if (legacyCipher && oldPin) {
          try {
            const bytes = CryptoJS.AES.decrypt(legacyCipher, oldPin);
            const str = bytes.toString(CryptoJS.enc.Utf8);
            if (str) initialData = normalizeData(JSON.parse(str));
          } catch (e) {}
        } else {
          try {
            const localLegacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
            if (localLegacy && !localLegacy.ciphertext) initialData = normalizeData(localLegacy);
          } catch (e) {}
        }
      }

      const newUser = {
        email,
        name,
        pinHash: hashPin(pin),
        isAdmin: !hasUsers,
        partnerEmail: '',
        createdAt: toISO(TODAY),
        data: initialData,
      };

      const nextReg = {
        version: 3,
        users: { ...users, [email]: newUser }
      };
      setRegistry(nextReg);
      setCurrentUserEmail(email);
      sessionStorage.setItem(SESSION_KEY, email);
      setWorkspaceMode('user1');
      setAuthStatus('authenticated');
      return { ok: true };
    }
  };

          categories: cat2,
          goals: goals2,

          users: {

      const { data: row, error: fetchErr } = await client.from('wealthos_data').select('json_data').eq('id', 1).maybeSingle();
      if (fetchErr) throw fetchErr;

      let latestReg = regRef.current;
      if (row && row.json_data && row.json_data.v3_vault) {

          latestReg = {

            users: {
              ...cloudReg.users,

            }
          };

      }

        setSync('ready');
        return; // Không có gì đổi, hủy lệnh lưu
      }

      // BƯỚC 2: MÃ HÓA BẢN MERGE VÀ PUSH LÊN MÂY
      const v3_vault = CryptoJS.AES.encrypt(strToSave, CLOUD_SECRET).toString();
      const { error: upsertErr } = await client.from('wealthos_data').upsert({ id: 1, json_data: { v3_vault } });
      if (upsertErr) throw upsertErr;

      lastSaved.current = strToSave;
      try { localStorage.setItem(KEY, JSON.stringify({ v3_vault })); } catch (e) {}

      // Đồng bộ lại UI nếu phát hiện vợ vừa thêm khoản mới
      setRegistry(latestReg);

          <div className="h-2" />
        </main>
        <nav aria-label="Điều hướng" className="shrink-0 grid grid-cols-4 bg-white border-t border-slate-200" style={{ paddingBottom: framed ? 10 : 'max(6px, env(safe-area-inset-bottom, 0px))' }}>
          {PTABS.map((t) => (
            <button key={t.k} type="button" onClick={() => setTab(t.k)} aria-current={tab === t.k ? 'page' : undefined}
              className={`flex flex-col items-center gap-0.5 pt-2 pb-1 text-[10px] font-bold ${tab === t.k ? 'text-indigo-600' : 'text-slate-400'}`}>
              <Icon name={t.icon} size={20} />{t.label}
            </button>
          ))}
        </nav>
        {showAdminModal && (
          <AdminCoworkModal
            registry={registry}
            currentUserEmail={currentUserEmail}
            onClose={() => setShowAdminModal(false)}
            onSaveRegistry={(nextReg) => setRegistry(nextReg)}
            onSelectInspectUser={(uMail) => { setInspectEmail(uMail); setWorkspaceMode('admin_inspect'); }}
          />
        )}
      </div>
    );
    if (!framed) return <div className="fixed inset-0 w-full">{shell}</div>;
    return (
      <div className="min-h-screen w-full grid place-items-center bg-slate-200 p-4 overflow-hidden">
        <div className="relative rounded-[56px] bg-slate-900 p-[10px] shadow-2xl" style={{ width: 410 }}>
          <div className="relative overflow-hidden rounded-[46px] bg-white" style={{ height: 'min(830px, calc(100dvh - 56px))', transform: 'translateZ(0)' }}>
            <div className="absolute left-1/2 top-2 z-40 h-[26px] w-[92px] -translate-x-1/2 rounded-full bg-black" aria-hidden="true" />
            {shell}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 p-2 sm:p-4 overflow-x-hidden">
      <div className={outer}>
        <div className={frame}>
          <div className={root}>
            <div className={tier}>{coworkToolbar}</div>

            <header className={`${tier} flex ${head} justify-between gap-3`}>
              <div className="min-w-0">
                <p className="inline-flex items-center gap-1.5 text-[11px] font-bold tracking-widest text-indigo-600">
                  <Icon name="layers" size={14} />WEALTHOS PRO · {meUser.isAdmin ? 'ADMIN TỐI THƯỢNG' : 'QUẢN LÝ GIA SẢN & TỰ DO TÀI CHÍNH'}
                </p>
                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 mt-1">{activeTitle}</h1>
                <p className="text-xs text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                  <SyncBadge sync={sync} onRetry={retry} />
                  <span>Gmail: <b>{currentUserEmail}</b> · VNĐ · <LiveClock /></span>
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-2 no-print">
                <DarkToggle dark={dark} setDark={setDark} />
                <button type="button" onClick={() => window.print()}
                  title="Xuất PDF / In báo cáo"
                  className="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg bg-white border border-slate-200 shadow-sm text-slate-600 hover:bg-slate-100 transition">
                  <Icon name="print" size={14} />PDF
                </button>
                <ViewSwitcher view={view} setView={setView} />
              </div>
            </header>

            {kpiBlock}

            <div className={`${tier} grid gap-4 items-start ${midGrid}`}>
              {allocation}
              {balance}
            </div>

            <div className={tier}><NetWorthCard history={history} /></div>

            <div className={tier}>{portfolio}</div>

            <div className={`${tier} grid gap-4 items-start ${botGrid}`}>
              {topAssets}
              {spending}
              {goals}
            </div>
          </div>
        </div>
      </div>

      {showAdminModal && (
        <AdminCoworkModal
          registry={registry}
          currentUserEmail={currentUserEmail}
          onClose={() => setShowAdminModal(false)}
          onSaveRegistry={(nextReg) => setRegistry(nextReg)}
          onSelectInspectUser={(uMail) => { setInspectEmail(uMail); setWorkspaceMode('admin_inspect'); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
