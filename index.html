function normalize(raw, base) {

  CLASSES.forEach((c) => { out.targets[c.key] = num(out.targets[c.key]); });

  out.debts = { risk: num(rd.risk), safe: num(rd.safe), fixed: num(rd.fixed) };

    items: (Array.isArray(r.items) ? r.items : []).map((it) => ({ id: it.id || uid(), name: String(it.name || ''), amount: num(it.amount) })),
  }));

function compute(d) {
  const stockTotal = sum(d.stocks, (r) => r.qty * r.price);
  const goldTotal = sum(d.gold, (r) => r.qty * r.price);
  const bankTotal = sum(d.savings, (r) => r.principal);
  const actual = { stock: stockTotal, gold: goldTotal, bank: bankTotal, cash: d.cash, recv: d.receivable, estate: d.estate };
  const total = sum(CLASSES, (c) => actual[c.key]);
  const debt = d.debts.risk + d.debts.safe + d.debts.fixed;
  const pct = {};
  CLASSES.forEach((c) => { pct[c.key] = total > 0 ? (actual[c.key] / total) * 100 : 0; });
  const spent = sum(d.categories, catTotal);
  const net = total - debt;
  const fireTarget = d.fireTarget > 0 ? d.fireTarget : spent * 12 * 25;
  const groups = GROUPS.map((g) => {
    const assets = sum(CLASSES.filter((c) => c.group === g.key), (c) => actual[c.key]);
    return { ...g, assets, debt: d.debts[g.key], equity: assets - d.debts[g.key] };
  });
  return {
    stockTotal, goldTotal, bankTotal, actual, total, debt, net, pct, spent, groups, fireTarget,
    surplus: d.income - spent,
    firePct: fireTarget > 0 ? Math.max(0, (net / fireTarget) * 100) : 0,
    targetSum: sum(CLASSES, (c) => d.targets[c.key]),
  };
}

  return { ...r, price: next, dir: next >= r.price ? 1 : -1 };
}
function niceAxis(max) {
  const m = max > 0 ? max : 1e6;
  const base = Math.pow(10, Math.floor(Math.log10(m / 4)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * base).find((s) => s * 4 >= m) || 10 * base;
  const n = Math.max(1, Math.ceil(m / step));
  return { max: n * step, ticks: Array.from({ length: n + 1 }, (_, i) => i * step) };
}

function sanitizeDec(raw) {

  for (const ch of raw) {

    else if (ch >= '0' && ch <= '9') out += ch;

function NumInput({ value, onChange, decimal = false, className = '', placeholder = '0', id, ariaLabel, blankZero = false }) {
  const toTxt = (v) => (decimal ? String(num(v)).replace('.', ',') : (num(v) === 0 ? (blankZero ? '' : '0') : fmt(v)));
  const parse = (t) => (decimal ? num(t.replace(',', '.')) : num(t.replace(/\D/g, '')));
  const [txt, setTxt] = useState(toTxt(value));
  useEffect(() => { if (parse(txt) !== num(value)) setTxt(toTxt(value)); }, [value]);
  const handle = (e) => {
    const raw = e.target.value;
    if (decimal) {
      const t = sanitizeDec(raw);
      setTxt(t);
      onChange(parse(t));
    } else {
      const digits = raw.replace(/\D/g, '').replace(/^0+(?=\d)/, '');

      onChange(digits === '' ? 0 : Number(digits));

}

          {children}

        {!isEmpty && foot && <tfoot>{foot}</tfoot>}

}
function Pnl({ amount, p }) {

  const sign = amount > 0 ? '+' : '';
  return (
    <div className={`text-right tnum leading-tight ${cls}`}>
      <div className="font-semibold">{sign}<Money v={amount} /></div>
      <div className="text-[10px]">({sign}{pcv(p)})</div>

}
function Countdown({ days }) {
  if (days < 0) return <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-rose-50 text-rose-700">Quá hạn {Math.abs(days)} ngày</span>;

}

function DonutChart({ actual, targets, total, size = 'w-44 h-44' }) {
  const [hv, setHv] = useState(null);
  const aSum = CLASSES.reduce((s, c) => s + Math.max(0, actual[c.key]), 0);
  const tSum = CLASSES.reduce((s, c) => s + Math.max(0, targets[c.key]), 0);
  const rings = [
    { id: 'out', r: 86, sw: 24, sum: aSum, items: CLASSES.map((c) => ({ c, v: Math.max(0, actual[c.key]) })) },
    { id: 'in', r: 57, sw: 18, sum: tSum, items: CLASSES.map((c) => ({ c, v: Math.max(0, targets[c.key]) })) },
  ];
  let info = null;
  if (hv) {
    const c = CLASSES.find((x) => x.key === hv.key);
    info = hv.ring === 'out'
      ? { head: 'Thực tế', label: c.label, amount: actual[c.key], p: aSum > 0 ? (actual[c.key] / aSum) * 100 : 0, color: c.ink }
      : { head: 'Mục tiêu', label: c.label, amount: (total * targets[c.key]) / 100, p: targets[c.key], color: c.ink };
  }
  return (
    <svg viewBox="0 0 220 220" className={`${size} shrink-0`} role="img" aria-label="Donut kép: vòng ngoài thực tế, vòng trong mục tiêu">
      {rings.map((ring) => {
        const C = 2 * Math.PI * ring.r;
        let acc = 0;
        return (
          <g key={ring.id}>
            <circle cx="110" cy="110" r={ring.r} fill="none" stroke="#e2e8f0" strokeWidth={ring.sw} />
            {ring.sum > 0 && ring.items.map(({ c, v }) => {
              const len = (v / ring.sum) * C;
              const off = acc;
              acc += len;
              if (len <= 0) return null;
              const dim = hv && !(hv.ring === ring.id && hv.key === c.key);
              return (
                <circle key={c.key} cx="110" cy="110" r={ring.r} fill="none" stroke={c.color} strokeWidth={ring.sw}
                  strokeDasharray={`${len} ${C - len}`} strokeDashoffset={-off} transform="rotate(-90 110 110)"
                  style={{ opacity: dim ? 0.3 : 1, cursor: 'pointer', transition: 'opacity .15s' }}
                  onMouseEnter={() => setHv({ ring: ring.id, key: c.key })} onMouseLeave={() => setHv(null)}
                  onClick={() => setHv((h) => (h && h.ring === ring.id && h.key === c.key ? null : { ring: ring.id, key: c.key }))}>
                  <title>{`${ring.id === 'out' ? 'Thực tế' : 'Mục tiêu'} · ${c.label}: ${pcv((v / ring.sum) * 100, 0)}`}</title>
                </circle>
              );
            })}
          </g>
        );
      })}
      {info ? (
        <g textAnchor="middle" style={{ pointerEvents: 'none' }}>
          <text x="110" y="94" fontSize="12" fill="#64748b" fontWeight="600">{info.head}</text>
          <text x="110" y="110" fontSize="13" fill={info.color} fontWeight="700">{info.label}</text>
          <text x="110" y="128" fontSize="16" fill="#0f172a" fontWeight="800">{compact(info.amount)}</text>
          <text x="110" y="143" fontSize="12" fill="#475569" fontWeight="600">{pcv(info.p, 0)}</text>
        </g>
      ) : (
        <g textAnchor="middle" style={{ pointerEvents: 'none' }}>
          <text x="110" y="102" fontSize="12" fill="#64748b" fontWeight="600">Tổng TS</text>
          <text x="110" y="124" fontSize="19" fill="#0f172a" fontWeight="800">{compact(total)}</text>
        </g>
      )}
    </svg>
  );
}

function AllocationCard({ data, setData, c, view }) {
  const setTarget = (k, v) => setData((d) => ({ ...d, targets: { ...d.targets, [k]: v } }));
  const targetOk = Math.abs(c.targetSum - 100) < 0.001;
  const autos = { stock: c.stockTotal, gold: c.goldTotal, bank: c.bankTotal };
  const entry = { cash: [data.cash, (v) => setData((d) => ({ ...d, cash: v }))], recv: [data.receivable, (v) => setData((d) => ({ ...d, receivable: v }))], estate: [data.estate, (v) => setData((d) => ({ ...d, estate: v }))] };
  const mode = data.recMode;
  const S = c.surplus;
  const rows = CLASSES.map((cl) => {
    const target = (c.total * data.targets[cl.key]) / 100;
    return { cl, actual: c.actual[cl.key], target, diff: target - c.actual[cl.key] };
  });
  let monthly = rows.map(() => 0);
  if (mode === 'monthly' && S > 0) {
    const newTotal = c.total + S;
    const gaps = CLASSES.map((cl) => Math.max(0, (newTotal * data.targets[cl.key]) / 100 - c.actual[cl.key]));
    const gapSum = gaps.reduce((a, b) => a + b, 0);
    monthly = gaps.map((g) => (gapSum > 0 ? (g * S) / gapSum : 0));
  }
  const shown = rows.map((r, i) => ({ ...r, i })).filter((r) => r.actual > 0 || r.target > 0);
  return (
    <Card title="Cơ cấu danh mục đầu tư" right={<span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${targetOk ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`} role={targetOk ? undefined : 'alert'}>MỤC TIÊU: {pcv(c.targetSum, Number.isInteger(c.targetSum) ? 0 : 1)}</span>}>
      <div className="flex justify-center"><DonutChart actual={c.actual} targets={data.targets} total={c.total} /></div>

        <span /><span /><span className="text-[10px] font-semibold text-slate-400 text-right">Giá trị (₫)</span><span className="text-[10px] font-semibold text-slate-400 text-right">TT</span><span className="text-[10px] font-semibold text-slate-400 text-right">MT %</span>
        {CLASSES.map((cl) => (
          <React.Fragment key={cl.key}>
            <span className="h-2.5 w-2.5 rounded-full" style={{ background: cl.color }} aria-hidden="true" />
            {cl.key === 'estate'
              ? <input id="estate-name" aria-label="Tên bất động sản" value={data.estateName} placeholder="Bất động sản" onChange={(e) => setData((d) => ({ ...d, estateName: e.target.value }))} className={`${CELL_L} font-semibold text-slate-700 min-w-0`} />
              : <span className="font-semibold text-slate-700 truncate" title={cl.label}>{cl.label}</span>}
            {cl.key in autos
              ? <Money v={autos[cl.key]} className="text-right font-bold text-slate-900" />
              : <NumInput id={`bs-${cl.key}`} ariaLabel={`Giá trị ${cl.label}`} value={entry[cl.key][0]} onChange={entry[cl.key][1]} className="w-full bg-slate-50 rounded-md border border-slate-200 px-1.5 py-0.5 text-right font-bold tnum outline-none focus:border-indigo-400 focus:bg-white" />}
            <span className="text-right tnum text-slate-600">{pcv(c.pct[cl.key], 0)}</span>
            <NumInput id={`tg-${cl.key}`} ariaLabel={`Mục tiêu ${cl.label}`} decimal value={data.targets[cl.key]} onChange={(v) => setTarget(cl.key, v)} className="w-full bg-slate-50 rounded-md border border-slate-200 px-1 py-0.5 text-right font-bold tnum outline-none focus:border-indigo-400 focus:bg-white" />
          </React.Fragment>
        ))}
      </div>
      <p className="text-[10px] text-slate-400 mt-1.5">Cổ phiếu, vàng, tiền gửi tự cộng từ bảng nhập danh mục bên dưới.</p>

      <div className="mt-4 pt-4 border-t border-slate-100">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
          <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Lệch so với mục tiêu</h3>
          <div role="tablist" aria-label="Chế độ khuyến nghị" className="flex gap-1">
            <TabButton small active={mode === 'rebalance'} onClick={() => setData((d) => ({ ...d, recMode: 'rebalance' }))}>Tái cân bằng</TabButton>
            <TabButton small active={mode === 'monthly'} onClick={() => setData((d) => ({ ...d, recMode: 'monthly' }))}>Từ thặng dư</TabButton>
          </div>
        </div>
        {mode === 'monthly' && <p className="text-[11px] text-slate-500 mb-2">Chia thặng dư <Money v={S} className="font-bold text-slate-700" />/tháng để mua thêm, không bán tài sản đang có.</p>}
        <ul className="space-y-1.5">
          {shown.map((r) => {
            let body, tone;
            if (mode === 'rebalance') {
              if (r.diff >= 1) { body = <>Cần bổ sung <Money v={r.diff} className="font-bold" /> {r.cl.label}</>; tone = 'bg-emerald-50 text-emerald-800'; }
              else if (r.diff <= -1) { body = <>Cần giảm <Money v={-r.diff} className="font-bold" /> {r.cl.label}</>; tone = 'bg-amber-50 text-amber-800'; }
              else { body = <>{r.cl.label} đúng mục tiêu</>; tone = 'bg-slate-50 text-slate-600'; }
            } else if (monthly[r.i] >= 1) {
              body = <>Mua thêm <Money v={monthly[r.i]} className="font-bold" />/tháng {r.cl.label}</>; tone = 'bg-emerald-50 text-emerald-800';
            } else {
              body = <>{r.cl.label} đã đủ, tạm dừng bổ sung</>; tone = 'bg-slate-50 text-slate-600';
            }
            return (
              <li key={r.cl.key} className={`flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-xs ${tone}`}>
                <span className="h-2 w-2 rounded-full shrink-0" style={{ background: r.cl.color }} aria-hidden="true" />
                <span className="flex-1 min-w-0">{body}</span>
              </li>
            );
          })}
          {shown.length === 0 && <li className="text-xs text-slate-400 py-2">Nhập giá trị tài sản để xem độ lệch.</li>}
        </ul>
        {mode === 'monthly' && S <= 0 && <p className="text-[11px] text-amber-700 mt-2">Thặng dư ≤ 0 nên chưa có khoản nào để phân bổ.</p>}
      </div>
    </Card>
  );
}

          <p className="text-xs text-slate-500">Toàn bộ dữ liệu của cả hai chế độ. Sao chép để sao lưu, hoặc dán/chọn file JSON rồi bấm “Áp dụng dữ liệu”.</p>
          <textarea id="json-area" ref={taRef} value={text} onChange={(e) => setText(e.target.value)} spellCheck={false} className="flex-1 min-h-[220px] w-full rounded-xl border border-slate-200 bg-slate-50 p-3 font-mono text-xs text-slate-800 outline-none focus:border-indigo-400" />
          <div className="flex flex-wrap items-center gap-2">
            <button type="button" onClick={copy} className="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-700"><Icon name="copy" size={14} />Sao chép JSON</button>
            <button type="button" onClick={apply} className="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-500"><Icon name="check" size={14} />Áp dụng dữ liệu</button>
            <label htmlFor="json-file" className="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 cursor-pointer"><Icon name="upload" size={14} />Chọn file .json</label>
            <input id="json-file" type="file" accept=".json,application/json" onChange={pick} className="sr-only" />
          </div>
          {msg && <p className="text-xs font-semibold text-indigo-700" role="status">{msg}</p>}
        </div>
      </div>
    </div>
  );
}

function Portfolio({ data, setData, c, live, setLive }) {
  const [tabKey, setTabKey] = useState('stocks');
  const [adding, setAdding] = useState(false);
  const tab = TABS.find((t) => t.key === tabKey);
  const upd = (key, id, patch) => setData((d) => ({ ...d, [key]: d[key].map((r) => (r.id === id ? { ...r, ...patch } : r)) }));
  const del = (key, id) => setData((d) => ({ ...d, [key]: d[key].filter((r) => r.id !== id) }));
  const addRow = (f) => {
    const row = { id: uid() };
    if (tabKey === 'stocks') Object.assign(row, { code: String(f.code).toUpperCase(), qty: num(f.qty), cost: num(f.cost), price: num(f.price), target: num(f.target), dir: 0 });
    if (tabKey === 'gold') Object.assign(row, { type: String(f.type), qty: num(f.qty), cost: num(f.cost), price: num(f.price), target: num(f.target) });
    if (tabKey === 'savings') Object.assign(row, { bank: String(f.bank), principal: num(f.principal), rate: num(f.rate), term: num(f.term), start: f.start || toISO(TODAY) });
    setData((d) => ({ ...d, [tabKey]: [...d[tabKey], row] }));
    setAdding(false);
  };
  const tickPrices = () => setData((d) => ({ ...d, stocks: d.stocks.map(simulatePrice) }));
  const totalOf = { stocks: c.stockTotal, gold: c.goldTotal, savings: c.bankTotal }[tabKey];
  const rows = data[tabKey];
  const st = c.pct[tab.cls] - data.targets[tab.cls];
  const stText = Math.abs(st) <= 2 ? 'Cân đối' : st < 0 ? `Thiếu ${pcv(Math.abs(st))} so mục tiêu` : `Vượt ${pcv(st)} so mục tiêu`;
  const stCls = Math.abs(st) <= 2 ? 'bg-emerald-50 text-emerald-700' : st < 0 ? 'bg-amber-50 text-amber-700' : 'bg-sky-50 text-sky-700';
  const TD = 'px-2 py-1';
  const targetSum = (key) => sum(data[key], (r) => r.target);
  const tgtCls = (key) => (Math.abs(targetSum(key) - 100) > 0.001 ? 'text-rose-600' : 'text-slate-700');

  let heads, body, foot;
  if (tabKey === 'stocks') {
    heads = [{ t: 'Mã CP', a: 'l' }, { t: 'KL' }, { t: 'Giá vốn TB' }, { t: 'Giá HT' }, { t: 'Giá trị' }, { t: 'Lãi/Lỗ' }, { t: '% TT' }, { t: '% Target' }, { t: '' }];
    body = rows.map((r) => {
      const value = r.qty * r.price, pnl = r.qty * (r.price - r.cost), pp = r.cost > 0 ? ((r.price - r.cost) / r.cost) * 100 : 0;
      return (
        <tr key={r.id} className="border-t border-slate-100 hover:bg-slate-50">
          <td className={`${TD} w-24`}><input id={`stk-${r.id}-code`} aria-label="Mã cổ phiếu" value={r.code} placeholder="VD: FPT" onChange={(e) => upd('stocks', r.id, { code: e.target.value.toUpperCase() })} className={`${CELL_L} font-bold uppercase`} /></td>
          <td className={`${TD} w-24`}><NumInput id={`stk-${r.id}-qty`} ariaLabel="Khối lượng" value={r.qty} onChange={(v) => upd('stocks', r.id, { qty: v })} className={CELL} /></td>
          <td className={`${TD} w-28`}><NumInput id={`stk-${r.id}-cost`} ariaLabel="Giá vốn" value={r.cost} onChange={(v) => upd('stocks', r.id, { cost: v })} className={CELL} /></td>
          <td className={`${TD} w-32`}>
            <div className="flex items-center gap-0.5">
              <span className={r.dir > 0 ? 'text-emerald-600' : r.dir < 0 ? 'text-rose-600' : 'text-transparent'} aria-hidden="true"><Icon name={r.dir < 0 ? 'down' : 'up'} size={10} /></span>
              <NumInput id={`stk-${r.id}-price`} ariaLabel="Giá hiện tại" value={r.price} onChange={(v) => upd('stocks', r.id, { price: v, dir: 0 })} className={CELL} />
            </div>
          </td>
          <td className={`${TD} text-right font-bold text-slate-900 whitespace-nowrap`}><Money v={value} /></td>
          <td className={`${TD} whitespace-nowrap`}><Pnl amount={pnl} p={pp} /></td>
          <td className={`${TD} text-right tnum text-slate-600`}>{pcv(c.stockTotal > 0 ? (value / c.stockTotal) * 100 : 0, 0)}</td>
          <td className={`${TD} w-20`}><NumInput id={`stk-${r.id}-tg`} ariaLabel="Phần trăm mục tiêu" decimal value={r.target} onChange={(v) => upd('stocks', r.id, { target: v })} className={CELL} /></td>
          <td className="px-1"><IconBtn tone="rose" icon="trash" label={`Xóa ${r.code || 'mã CP'}`} onClick={() => del('stocks', r.id)} /></td>
        </tr>

    });
    const tp = sum(rows, (r) => r.qty * (r.price - r.cost)), tc = sum(rows, (r) => r.qty * r.cost);
    foot = (
      <tr className="border-t-2 border-slate-200 bg-slate-50 font-bold">
        <td className="px-2 py-2" colSpan={4}>Tổng</td>
        <td className="px-2 py-2 text-right"><Money v={c.stockTotal} /></td>
        <td className="px-2 py-2"><Pnl amount={tp} p={tc > 0 ? (tp / tc) * 100 : 0} /></td>
        <td className="px-2 py-2 text-right tnum">100%</td>
        <td className={`px-2 py-2 text-right tnum ${tgtCls('stocks')}`}>{pcv(targetSum('stocks'), 0)}</td><td />
      </tr>
    );
  } else if (tabKey === 'gold') {
    heads = [{ t: 'Loại vàng', a: 'l' }, { t: 'SL (chỉ)' }, { t: 'Giá vốn/chỉ' }, { t: 'Giá HT/chỉ' }, { t: 'Giá trị' }, { t: 'Lãi/Lỗ' }, { t: '% TT' }, { t: '% Target' }, { t: '' }];
    body = rows.map((r) => {
      const value = r.qty * r.price, pnl = r.qty * (r.price - r.cost), pp = r.cost > 0 ? ((r.price - r.cost) / r.cost) * 100 : 0;
      return (
        <tr key={r.id} className="border-t border-slate-100 hover:bg-slate-50">
          <td className={`${TD} w-36`}><input id={`gld-${r.id}-type`} aria-label="Loại vàng" value={r.type} placeholder="VD: SJC" onChange={(e) => upd('gold', r.id, { type: e.target.value })} className={`${CELL_L} font-bold`} /></td>
          <td className={`${TD} w-20`}><NumInput id={`gld-${r.id}-qty`} ariaLabel="Số lượng chỉ" decimal value={r.qty} onChange={(v) => upd('gold', r.id, { qty: v })} className={CELL} /></td>
          <td className={`${TD} w-32`}><NumInput id={`gld-${r.id}-cost`} ariaLabel="Giá vốn mỗi chỉ" value={r.cost} onChange={(v) => upd('gold', r.id, { cost: v })} className={CELL} /></td>
          <td className={`${TD} w-32`}><NumInput id={`gld-${r.id}-price`} ariaLabel="Giá hiện tại mỗi chỉ" value={r.price} onChange={(v) => upd('gold', r.id, { price: v })} className={CELL} /></td>
          <td className={`${TD} text-right font-bold text-slate-900 whitespace-nowrap`}><Money v={value} /></td>
          <td className={`${TD} whitespace-nowrap`}><Pnl amount={pnl} p={pp} /></td>
          <td className={`${TD} text-right tnum text-slate-600`}>{pcv(c.goldTotal > 0 ? (value / c.goldTotal) * 100 : 0, 0)}</td>
          <td className={`${TD} w-20`}><NumInput id={`gld-${r.id}-tg`} ariaLabel="Phần trăm mục tiêu" decimal value={r.target} onChange={(v) => upd('gold', r.id, { target: v })} className={CELL} /></td>
          <td className="px-1"><IconBtn tone="rose" icon="trash" label={`Xóa ${r.type || 'loại vàng'}`} onClick={() => del('gold', r.id)} /></td>
        </tr>
      );
    });
    const tp = sum(rows, (r) => r.qty * (r.price - r.cost)), tc = sum(rows, (r) => r.qty * r.cost);
    foot = (
      <tr className="border-t-2 border-slate-200 bg-slate-50 font-bold">
        <td className="px-2 py-2">Tổng</td>
        <td className="px-2 py-2 text-right tnum">{String(sum(rows, (r) => r.qty)).replace('.', ',')}</td><td colSpan={2} />
        <td className="px-2 py-2 text-right"><Money v={c.goldTotal} /></td>
        <td className="px-2 py-2"><Pnl amount={tp} p={tc > 0 ? (tp / tc) * 100 : 0} /></td>
        <td className="px-2 py-2 text-right tnum">100%</td>
        <td className={`px-2 py-2 text-right tnum ${tgtCls('gold')}`}>{pcv(targetSum('gold'), 0)}</td><td />
      </tr>
    );
  } else {
    heads = [{ t: 'Ngân hàng', a: 'l' }, { t: 'Số tiền gốc' }, { t: 'Lãi suất %/năm' }, { t: 'Kỳ hạn (th)' }, { t: 'Ngày gửi', a: 'l' }, { t: 'Đáo hạn', a: 'l' }, { t: 'Lãi dự kiến' }, { t: '' }];
    body = rows.map((r) => {
      const maturity = addMonths(parseISO(r.start), Math.round(r.term));
      return (
        <tr key={r.id} className="border-t border-slate-100 hover:bg-slate-50">
          <td className={`${TD} w-36`}><input id={`sav-${r.id}-bank`} aria-label="Ngân hàng" value={r.bank} placeholder="VD: ACB" onChange={(e) => upd('savings', r.id, { bank: e.target.value })} className={`${CELL_L} font-bold`} /></td>
          <td className={`${TD} w-36`}><NumInput id={`sav-${r.id}-pr`} ariaLabel="Số tiền gốc" value={r.principal} onChange={(v) => upd('savings', r.id, { principal: v })} className={CELL} /></td>
          <td className={`${TD} w-20`}><NumInput id={`sav-${r.id}-rate`} ariaLabel="Lãi suất" decimal value={r.rate} onChange={(v) => upd('savings', r.id, { rate: v })} className={CELL} /></td>
          <td className={`${TD} w-16`}><NumInput id={`sav-${r.id}-term`} ariaLabel="Kỳ hạn tháng" value={r.term} onChange={(v) => upd('savings', r.id, { term: v })} className={CELL} /></td>
          <td className={TD}><input id={`sav-${r.id}-start`} aria-label="Ngày gửi" type="date" value={r.start} onChange={(e) => upd('savings', r.id, { start: e.target.value || toISO(TODAY) })} className={`${CELL_L} w-32`} /></td>
          <td className={`${TD} whitespace-nowrap`}><div className="font-semibold tnum text-slate-800">{fmtDate(maturity)}</div><Countdown days={daysBetween(TODAY, maturity)} /></td>
          <td className={`${TD} text-right font-bold text-emerald-600 whitespace-nowrap`}>+<Money v={(r.principal * r.rate * r.term) / 1200} /></td>
          <td className="px-1"><IconBtn tone="rose" icon="trash" label={`Xóa sổ ${r.bank || 'tiết kiệm'}`} onClick={() => del('savings', r.id)} /></td>
        </tr>
      );
    });
    foot = (
      <tr className="border-t-2 border-slate-200 bg-slate-50 font-bold">
        <td className="px-2 py-2">Tổng</td><td className="px-2 py-2 text-right"><Money v={c.bankTotal} /></td><td colSpan={4} />
        <td className="px-2 py-2 text-right text-emerald-600">+<Money v={sum(rows, (r) => (r.principal * r.rate * r.term) / 1200)} /></td><td />
      </tr>
    );
  }

  return (
    <section className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden min-w-0" style={{ borderTop: `4px solid ${tab.color}` }}>
      <div className="flex flex-wrap items-center justify-between gap-2 px-4 sm:px-5 pt-4 pb-2">
        <div className="min-w-0">
          <h2 className="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Nhập liệu danh mục đầu tư</h2>
          <div role="tablist" aria-label="Danh mục đầu tư" className="flex flex-wrap gap-1.5">
            {TABS.map((t) => <TabButton key={t.key} color={t.color} active={t.key === tabKey} onClick={() => setTabKey(t.key)}>{t.label}</TabButton>)}
          </div>
        </div>
        <div className="flex items-center gap-2">
          {tabKey === 'stocks' && (
            <>
              <label className="inline-flex items-center gap-1 text-[11px] text-slate-500 cursor-pointer select-none"><input id="live-price" type="checkbox" checked={live} onChange={(e) => setLive(e.target.checked)} className="accent-indigo-600" />Tự chạy 4s</label>
              <button type="button" onClick={tickPrices} className="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100"><Icon name="refresh" size={12} />Cập nhật giá</button>
            </>
          )}
          <button type="button" onClick={() => setAdding(true)} aria-label={tab.add} title={tab.add} className="inline-flex items-center gap-1 text-xs font-bold px-3 py-2 rounded-lg text-white hover:opacity-90 active:scale-95 transition" style={{ background: tab.color }}><Icon name="plus" size={14} />{tab.add}</button>
        </div>
      </div>
      <div className="flex flex-wrap items-center gap-2 px-4 sm:px-5 pb-3 text-xs">
        <span className="font-bold text-slate-700">{tab.label}:</span>
        <Money v={totalOf} className="font-extrabold text-slate-900" />
        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ background: tab.color + '22', color: tab.ink }}>{pcv(c.pct[tab.cls])} Tổng TS</span>
        <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${stCls}`}>{stText}</span>
      </div>
      <div className="max-h-[420px] overflow-y-auto thin-scroll">
        <TableLayout heads={heads} isEmpty={rows.length === 0} empty={`Chưa có dữ liệu ${tab.label.toLowerCase()}. Bấm “${tab.add}” để nhập, hoặc gạt sang “Demo”.`} foot={foot}>{body}</TableLayout>
      </div>
      {adding && <AddModal tab={tab} onSubmit={addRow} onClose={() => setAdding(false)} />}
    </section>
  );
}

function TopAssetsCard({ data, c }) {
  const items = [
    ...data.stocks.map((r) => ({ name: `Cổ phiếu ${r.code || '(chưa đặt mã)'}`, type: 'Cổ phiếu', value: r.qty * r.price, color: CLASSES[0].color })),
    ...data.gold.map((r) => ({ name: `Vàng ${r.type || '(chưa đặt tên)'}`, type: 'Vàng', value: r.qty * r.price, color: CLASSES[1].color })),
    ...data.savings.map((r) => ({ name: `Sổ tiết kiệm ${r.bank || '(chưa đặt tên)'}`, type: 'Tiền gửi', value: r.principal, color: CLASSES[2].color })),
    { name: 'Tiền mặt', type: 'Tiền mặt', value: data.cash, color: CLASSES[3].color },
    { name: 'Nợ phải đòi', type: 'Nợ phải đòi', value: data.receivable, color: CLASSES[4].color },
    { name: data.estateName || 'Bất động sản', type: 'Bất động sản', value: data.estate, color: CLASSES[5].color },
  ].filter((a) => a.value > 0).sort((a, b) => b.value - a.value).slice(0, 6);
  const max = items.length ? items[0].value : 1;
  return (
    <Card title="Top tài sản lớn nhất" right={<span className="text-[11px] font-semibold text-slate-500 tnum">Tổng TS {compact(c.total)}</span>}>
      <div className="space-y-3.5">
        {items.length === 0 && <p className="text-xs text-slate-400 text-center py-6">Chưa có tài sản. Nhập giá trị ở khối cơ cấu danh mục hoặc bảng nhập liệu.</p>}
        {items.map((a, i) => (
          <ProgressRow key={a.name + i} title={a.name} sub={`${a.type} · ${pcv(c.total > 0 ? (a.value / c.total) * 100 : 0)} tổng TS`} valueText={compact(a.value)} valueTitle={vnd(a.value)} pct={(a.value / max) * 100} color={a.color}
            lead={<span className="h-6 w-6 shrink-0 rounded-full bg-slate-100 text-slate-600 text-[11px] font-extrabold grid place-items-center">{i + 1}</span>} />
        ))}
      </div>
    </Card>
  );
}
function CategoryRow({ cat, budget, onChange, onDelete }) {
  const [open, setOpen] = useState(false);
  const total = catTotal(cat);
  const p = budget > 0 ? (total / budget) * 100 : 0;
  const over = p > 100;
  const addItem = () => {
    let items = cat.items, amount = cat.amount;
    if (items.length === 0 && amount > 0) { items = [{ id: uid(), name: 'Chi chung', amount }]; amount = 0; }
    onChange({ items: [...items, { id: uid(), name: '', amount: 0 }], amount });
    setOpen(true);
  };
  const updItem = (id, patch) => onChange({ items: cat.items.map((i) => (i.id === id ? { ...i, ...patch } : i)) });
  const delItem = (id) => { const items = cat.items.filter((i) => i.id !== id); onChange({ items, amount: items.length ? cat.amount : 0 }); };
  return (
    <div>
      <div className="flex items-center gap-1.5">
        <span className="h-2.5 w-2.5 rounded-full shrink-0" style={{ background: cat.color }} aria-hidden="true" />
        <input id={`cat-${cat.id}-name`} aria-label="Tên nhóm chi tiêu" value={cat.name} placeholder="Tên nhóm" onChange={(e) => onChange({ name: e.target.value })} className={`${CELL_L} flex-1 min-w-0 text-sm font-semibold text-slate-800`} />
        {cat.items.length > 0
          ? <Money v={total} className="text-sm font-bold text-slate-900" />
          : <div className="w-28"><NumInput id={`cat-${cat.id}-amt`} ariaLabel={`Tổng nhóm ${cat.name}`} value={cat.amount} onChange={(v) => onChange({ amount: v })} className={`${CELL} text-sm font-bold`} /></div>}
        <span className={`w-10 text-right text-[11px] font-bold tnum ${over ? 'text-rose-600' : 'text-slate-500'}`}>{pcv(p, 0)}</span>
        <button type="button" onClick={() => setOpen(!open)} aria-expanded={open} aria-label={open ? 'Thu gọn' : 'Mở chi tiết khoản chi'} className="p-1 rounded-md text-slate-400 hover:bg-slate-100">
          <span className="block transition-transform" style={{ transform: open ? 'rotate(180deg)' : 'none' }}><Icon name="chevron" size={14} /></span>
        </button>
        <IconBtn tone="rose" icon="trash" label={`Xóa nhóm ${cat.name}`} onClick={onDelete} />
      </div>
      <div className="ml-4 mt-1"><Bar pct={p} color={over ? '#e11d48' : cat.color} label={cat.name} /></div>
      {open && (
        <div className="ml-4 mt-2 space-y-1">
          {cat.items.map((it) => (
            <div key={it.id} className="flex items-center gap-1.5">
              <input id={`it-${it.id}-name`} aria-label="Tên khoản chi" value={it.name} placeholder="VD: Tiền điện" onChange={(e) => updItem(it.id, { name: e.target.value })} className={`${CELL_L} flex-1 min-w-0 bg-slate-50`} />
              <div className="w-28 shrink-0"><NumInput id={`it-${it.id}-amt`} ariaLabel={`Số tiền ${it.name}`} value={it.amount} onChange={(v) => updItem(it.id, { amount: v })} className={`${CELL} bg-slate-50`} /></div>
              <IconBtn tone="rose" icon="trash" label={`Xóa khoản ${it.name}`} onClick={() => delItem(it.id)} />
            </div>
          ))}
          <button type="button" onClick={addItem} className="inline-flex items-center gap-1 text-[11px] font-bold text-indigo-600 hover:text-indigo-800"><Icon name="plus" size={12} />Thêm khoản chi (tiền nhà, tiền điện, đổ xăng...)</button>
        </div>
      )}
    </div>
  );
}

        <div>
          <label htmlFor="budget" className="text-[10px] font-bold uppercase tracking-wide text-slate-500">Ngân sách chi tiêu</label>
          <NumInput id="budget" value={data.budget} onChange={(v) => setData((d) => ({ ...d, budget: v }))} className={`${BOXED} text-indigo-700`} />
        </div>
      </div>
      <div className="space-y-3.5">
        {data.categories.length === 0 && <p className="text-xs text-slate-400 text-center py-4">Chưa có nhóm chi tiêu. Bấm + để thêm.</p>}
        {data.categories.map((cat) => <CategoryRow key={cat.id} cat={cat} budget={data.budget} onChange={(patch) => updCat(cat.id, patch)} onDelete={() => delCat(cat.id)} />)}
        <ProgressRow title={left >= 0 ? 'Ngân sách còn lại' : 'Vượt ngân sách'} valueText={compact(Math.abs(left))} valueTitle={vnd(Math.abs(left))} pctText={pcv(data.budget > 0 ? (Math.abs(left) / data.budget) * 100 : 0, 0)} pct={data.budget > 0 ? (Math.abs(left) / data.budget) * 100 : 0} color={left >= 0 ? '#cbd5e1' : '#e11d48'} />
      </div>
      <p className="text-xs text-slate-500 mt-3 tnum">Đã chi <Money v={c.spent} className="font-bold text-rose-600" /> / <Money v={data.budget} className="font-bold text-slate-700" /></p>
    </Card>
  );
}
function projectGoal(g, surplus) {
  const rem = Math.max(0, g.target - g.current);
  const deadline = parseISO(g.deadline);
  const daysLeft = daysBetween(TODAY, deadline);
  if (g.target > 0 && rem === 0) return { kind: 'done', line: 'Đã đủ số tiền mục tiêu', rem };
  if (g.target <= 0) return { kind: 'none', line: 'Nhập số tiền mục tiêu để xem dự phóng', rem };
  if (surplus <= 0) return { kind: 'bad', line: 'Thặng dư ≤ 0, chưa thể tích lũy', rem };
  const months = Math.ceil(rem / surplus);
  const line = `Với thặng dư ${compact(surplus)}, cần ${months} tháng để hoàn thành`;
  if (daysLeft < 0) return { kind: 'bad', line, verdict: `Đã quá hạn ${Math.abs(daysLeft)} ngày`, rem };
  const monthsLeft = daysLeft / 30.4375;
  if (months <= monthsLeft) return { kind: 'ok', line, verdict: `Kịp hạn, dư ~${Math.max(0, Math.floor(monthsLeft - months))} tháng`, rem };
  return { kind: 'bad', line, verdict: `Không kịp hạn, trễ ~${Math.round(months - monthsLeft)} tháng. Cần ${compact(rem / Math.max(1, Math.floor(monthsLeft)))}/tháng`, rem };
}
function GoalsCard({ data, setData, c }) {
  const [editId, setEditId] = useState(null);
  const upd = (id, patch) => setData((d) => ({ ...d, goals: d.goals.map((g) => (g.id === id ? { ...g, ...patch } : g)) }));
  const del = (id) => setData((d) => ({ ...d, goals: d.goals.filter((g) => g.id !== id) }));
  const add = () => {
    const id = uid();
    setData((d) => ({ ...d, goals: [...d.goals, { id, name: 'Mục tiêu mới', current: 0, target: 0, deadline: toISO(addMonths(TODAY, 12)) }] }));
    setEditId(id);
  };
  return (
    <Card title="Tiến độ mục tiêu tài chính" right={<IconBtn icon="plus" label="Thêm mục tiêu" onClick={add} />}>
      <div className="space-y-3">
        {data.goals.length === 0 && <p className="text-xs text-slate-400 text-center py-4">Chưa có mục tiêu. Bấm + để thêm.</p>}
        {data.goals.map((g) => {
          const p = g.target > 0 ? (g.current / g.target) * 100 : 0;
          const size = c.total > 0 ? (g.target / c.total) * 100 : 0;
          const pj = projectGoal(g, c.surplus);
          const good = pj.kind === 'done' || pj.kind === 'ok';
          const editing = editId === g.id;
          return (
            <article key={g.id} className="rounded-xl border border-slate-100 bg-slate-50/60 p-3">
              <div className="flex items-center gap-1.5">
                {editing
                  ? <input id={`goal-${g.id}-name`} aria-label="Tên mục tiêu" value={g.name} onChange={(e) => upd(g.id, { name: e.target.value })} className={`${CELL_L} flex-1 min-w-0 font-bold bg-white`} />
                  : <h3 className="flex-1 min-w-0 truncate text-sm font-semibold text-slate-800">{g.name}</h3>}
                <span className={`text-sm font-extrabold tnum ${p >= 100 ? 'text-emerald-600' : 'text-indigo-700'}`}>{pcv(p, 0)}</span>
                <IconBtn icon={editing ? 'check' : 'edit'} label={editing ? 'Xong' : 'Sửa mục tiêu'} onClick={() => setEditId(editing ? null : g.id)} />
                <IconBtn tone="rose" icon="trash" label={`Xóa mục tiêu ${g.name}`} onClick={() => del(g.id)} />
              </div>
              <div className="mt-2"><Bar pct={p} color={p >= 100 ? '#16a34a' : '#4f46e5'} label={g.name} /></div>
              {editing ? (
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-2.5">
                  <div><label htmlFor={`goal-${g.id}-cur`} className="text-[10px] font-bold text-slate-500">Hiện có</label><NumInput id={`goal-${g.id}-cur`} value={g.current} onChange={(v) => upd(g.id, { current: v })} className={`${CELL} bg-white border-slate-200`} /></div>
                  <div><label htmlFor={`goal-${g.id}-tgt`} className="text-[10px] font-bold text-slate-500">Mục tiêu</label><NumInput id={`goal-${g.id}-tgt`} value={g.target} onChange={(v) => upd(g.id, { target: v })} className={`${CELL} bg-white border-slate-200`} /></div>
                  <div><label htmlFor={`goal-${g.id}-due`} className="text-[10px] font-bold text-slate-500">Hạn hoàn thành</label><input id={`goal-${g.id}-due`} type="date" value={g.deadline} onChange={(e) => upd(g.id, { deadline: e.target.value || g.deadline })} className={`${CELL_L} bg-white border-slate-200`} /></div>
                </div>
              ) : (
                <p className="text-[11px] text-slate-500 mt-2 tnum"><Money v={g.current} className="font-bold text-slate-700" /> / <Money v={g.target} className="font-bold text-slate-700" /> · {pcv(size)} Tổng TS · Hạn {fmtDate(parseISO(g.deadline))}</p>
              )}
              <p className={`text-[11px] mt-2 leading-snug rounded-md px-2 py-1.5 ${good ? 'bg-emerald-50 text-emerald-800' : pj.kind === 'bad' ? 'bg-rose-50 text-rose-800' : 'bg-slate-100 text-slate-600'}`} title={`Còn thiếu ${vnd(pj.rem)} · thặng dư ${vnd(c.surplus)}/tháng`}>
                {pj.line}{pj.verdict && <b className="block">{pj.verdict}</b>}
              </p>
            </article>
          );
        })}
      </div>
    </Card>
  );
}

const VIEWS = [
  { k: 'pc', label: 'PC View', icon: 'monitor' },
  { k: 'phone', label: 'iPhone View', icon: 'phone' },
  { k: 'auto', label: 'Auto', icon: 'auto' },
];
function ViewSwitcher({ view, setView }) {
  return (
    <div role="group" aria-label="Chế độ xem" className="inline-flex p-1 rounded-xl bg-white border border-slate-200 shadow-sm">
      {VIEWS.map((v) => (
        <button key={v.k} type="button" onClick={() => setView(v.k)} aria-pressed={view === v.k}
          className={`inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg transition whitespace-nowrap ${view === v.k ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
          <Icon name={v.icon} size={14} />{v.label}
        </button>
      ))}
    </div>
  );
}
function loadView() {
  try { const v = localStorage.getItem(VIEW_KEY); return v === 'pc' || v === 'phone' ? v : 'auto'; } catch (e) { return 'auto'; }
}
function useClock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  return now;
}

function App() {
  const [view, setView] = useState(loadView);
  const [store, setStore] = useState(null);
  const [loading, setLoading] = useState(true);
  const [live, setLive] = useState(false);
  const [modal, setModal] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const now = useClock();

  // ĐỌC DỮ LIỆU TỪ SUPABASE
  useEffect(() => {
    async function initData() {
      try {
        const { data, error } = await window.supabaseClient
          .from('wealthos_data')
          .select('json_data')
          .eq('id', 1)
          .single();

        if (error) throw error;
        if (data && data.json_data) {
          const raw = data.json_data;
          setStore({
            mode: raw.mode === 'demo' ? 'demo' : 'original',
            original: normalize(raw.original, makeOriginal()),
            demo: normalize(raw.demo, makeDemo()),
          });
        } else {
           setStore(loadStore()); 
        }
      } catch (e) {
        console.error('Lỗi tải dữ liệu Supabase:', e);
        setStore(loadStore()); // Lỗi mạng thì đọc tạm ở máy
      } finally {
        setLoading(false);
      }
    }
    initData();
  }, []);

  // LƯU DỮ LIỆU LÊN SUPABASE
  const saveTimeout = useRef(null);
  useEffect(() => {
    if (loading || !store) return;

    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}

    if (saveTimeout.current) clearTimeout(saveTimeout.current);
    saveTimeout.current = setTimeout(async () => {
      try {
        await window.supabaseClient
          .from('wealthos_data')
          .upsert({ id: 1, json_data: store });
      } catch (err) {
        console.error('Lỗi lưu Supabase:', err);
      }
    }, 1500); 
  }, [store, loading]);

  useEffect(() => { try { localStorage.setItem(VIEW_KEY, view); } catch (e) { return; } }, [view]);
  
  useEffect(() => {
    if (!live) return undefined;
    const t = setInterval(() => {
      setStore((s) => ({ ...s, [s.mode]: { ...s[s.mode], stocks: s[s.mode].stocks.map(simulatePrice) } }));
    }, 4000);
    return () => clearInterval(t);
  }, [live]);

  useEffect(() => {
    if (!confirmReset) return undefined;
    const t = setTimeout(() => setConfirmReset(false), 3500);
    return () => clearTimeout(t);
  }, [confirmReset]);

  // HIỂN THỊ MÀN HÌNH CHỜ KHI ĐANG TẢI DB
  if (loading || !store) return <div className="min-h-screen grid place-items-center bg-slate-50 text-slate-500 font-bold">Đang đồng bộ dữ liệu đám mây...</div>;

  const mode = store.mode;
  const isDemo = mode === 'demo';
  const data = store[mode];
  const setData = useCallback((fn) => setStore((s) => ({ ...s, [s.mode]: fn(s[s.mode]) })), []);
  const c = useMemo(() => compute(data), [data]);

  const setMode = (m) => setStore((s) => ({ ...s, mode: m }));
  const doReset = () => {
    if (!confirmReset) { setConfirmReset(true); return; }
    setStore((s) => ({ ...s, [s.mode]: makeFor(s.mode) }));
    setConfirmReset(false);
  };
  const doImport = (raw) => {
    if (raw && (raw.original || raw.demo)) setStore({ mode: raw.mode === 'demo' ? 'demo' : 'original', original: normalize(raw.original, makeOriginal()), demo: normalize(raw.demo, makeDemo()) });
    else setStore((s) => ({ ...s, [s.mode]: normalize(raw, makeFor(s.mode)) }));
  };

  const clock = [now.getHours(), now.getMinutes(), now.getSeconds()].map((x) => String(x).padStart(2, '0')).join(':');
  const outer = V(view, 'w-full', 'w-full overflow-x-auto thin-scroll', 'w-full');
  const frame = V(view, 'max-w-[428px] mx-auto overflow-x-hidden bg-slate-50 sm:border sm:border-slate-300 sm:rounded-[28px] sm:shadow-lg p-3', 'min-w-[1200px] p-4', 'max-w-[1600px] mx-auto p-3 sm:p-4');
  const root = `grid gap-4 ${V(view, 'grid-cols-1', 'grid-cols-12', 'grid-cols-1 lg:grid-cols-12')}`;
  const tier = V(view, '', 'col-span-12', 'lg:col-span-12');
  const kpiGrid = V(view, 'grid-cols-2', 'grid-cols-[1.4fr_1fr_1fr_1fr_1.2fr]', 'grid-cols-2 lg:grid-cols-[1.4fr_1fr_1fr_1fr_1.2fr]');
  const netSpan = V(view, 'col-span-2', '', 'col-span-2 lg:col-span-1');
  const midGrid = V(view, 'grid-cols-1', 'grid-cols-[35fr_65fr]', 'grid-cols-1 lg:grid-cols-[35fr_65fr]');
  const botGrid = V(view, 'grid-cols-1', 'grid-cols-3', 'grid-cols-1 lg:grid-cols-3');
  const head = V(view, 'flex-col', 'flex-row items-end', 'flex-col lg:flex-row lg:items-end');

  return (
    <div className="min-h-screen bg-slate-50 p-2 sm:p-4">
      <div className={outer}>
        <div className={frame}>
          <div className={root}>
            <header className={`${tier} flex ${head} justify-between gap-3`}>
              <div className="min-w-0">
                <p className="inline-flex items-center gap-1.5 text-[11px] font-bold tracking-widest text-indigo-600"><Icon name="layers" size={14} />WEALTHOS PRO · QUẢN LÝ GIA SẢN &amp; TỰ DO TÀI CHÍNH</p>
                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 mt-1">BÁO CÁO TỔNG QUAN GIA SẢN</h1>
                <p className="text-xs text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-1.5">
                  <span className="relative flex h-2 w-2"><span className="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60 animate-ping" /><span className="relative inline-flex h-2 w-2 rounded-full bg-emerald-500" /></span>
                  Đã kết nối Supabase Cloud | VNĐ · <span className="tnum">{clock}</span>
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button type="button" role="switch" aria-checked={isDemo} onClick={() => setMode(isDemo ? 'original' : 'demo')} className="inline-flex items-center gap-2 text-[11px] font-bold px-3 py-2 rounded-xl bg-white border border-slate-200 shadow-sm">
                  <span className={isDemo ? 'text-slate-400' : 'text-slate-900'}>Ảnh Gốc</span>
                  <span className={`relative h-5 w-9 rounded-full transition-colors shrink-0 ${isDemo ? 'bg-indigo-600' : 'bg-slate-300'}`}><span className="absolute top-0.5 h-4 w-4 rounded-full bg-white shadow transition-all" style={{ left: isDemo ? '18px' : '2px' }} /></span>
                  <span className={isDemo ? 'text-indigo-700' : 'text-slate-400'}>Demo</span>
                </button>
                <button type="button" onClick={() => setModal(true)} className="inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 shadow-sm"><Icon name="download" size={14} />Xuất/Nhập JSON</button>
                <button type="button" onClick={doReset} className={`inline-flex items-center gap-1.5 text-[11px] font-bold px-3 py-2.5 rounded-xl border shadow-sm transition ${confirmReset ? 'bg-rose-600 border-rose-600 text-white' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}`}><Icon name="reset" size={14} />{confirmReset ? 'Bấm lần nữa để xác nhận' : 'Khôi phục mặc định'}</button>
                <ViewSwitcher view={view} setView={setView} />
              </div>
            </header>

            <div className={`${tier} grid gap-3 ${kpiGrid}`}>
              <Kpi dark className={netSpan} label="Tổng tài sản ròng" sub={vnd(c.net)}><span title={vnd(c.net)}>{big(c.net)}</span></Kpi>
              <Kpi label="Tổng tài sản" sub={vnd(c.total)}><span title={vnd(c.total)}>{big(c.total)}</span></Kpi>
              <Kpi label="Tổng nợ" sub={`Chiếm ${pcv(c.total > 0 ? (c.debt / c.total) * 100 : 0)} tổng tài sản`} bar={c.total > 0 ? (c.debt / c.total) * 100 : 0} barColor="#f97316"><span className="text-orange-600" title={vnd(c.debt)}>{big(c.debt)}</span></Kpi>
              <Kpi label="Dòng tiền thặng dư (tháng)" sub={`Thu ${compact(data.income)} − chi ${compact(c.spent)} · tiết kiệm ${pcv(data.income > 0 ? (c.surplus / data.income) * 100 : 0)}`}>
                <span className={c.surplus >= 0 ? 'text-emerald-600' : 'text-rose-600'} title={vnd(c.surplus)}>{c.surplus >= 0 ? '+ ' : '− '}{fixed2(Math.abs(c.surplus) / 1e6)} triệu</span>
              </Kpi>
              <Kpi label="Mức độ tự do tài chính (FIRE)" sub={data.fireTarget > 0 ? `Mục tiêu FIRE ${compact(c.fireTarget)}` : `Tự động: 25 × chi tiêu năm = ${compact(c.fireTarget)}`} bar={c.firePct} barColor="#4f46e5"
                extra={
                  <div className="flex items-center gap-1.5 mt-2">
                    <label htmlFor="fire-target" className="text-[10px] font-bold text-slate-500 shrink-0">Mục tiêu FIRE</label>
                    <NumInput id="fire-target" blankZero value={data.fireTarget} placeholder="Tự động" onChange={(v) => setData((d) => ({ ...d, fireTarget: v }))} className="w-full min-w-0 rounded-md border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-xs font-bold tnum text-right outline-none focus:border-indigo-400 focus:bg-white" />
                  </div>
                }>
                <span className="text-indigo-700">{pcv(c.firePct, c.firePct < 10 ? 1 : 0)} <span className="text-sm font-bold text-slate-500">mục tiêu</span></span>
              </Kpi>
            </div>

            <div className={`${tier} grid gap-4 items-start ${midGrid}`}>
              <AllocationCard data={data} setData={setData} c={c} view={view} />
              <StackedCard data={data} setData={setData} c={c} />
            </div>

            <div className={tier}><Portfolio data={data} setData={setData} c={c} live={live} setLive={setLive} /></div>

            <div className={`${tier} grid gap-4 items-start ${botGrid}`}>
              <TopAssetsCard data={data} c={c} />
              <SpendingCard data={data} setData={setData} c={c} />
              <GoalsCard data={data} setData={setData} c={c} />
            </div>
          </div>
        </div>
      </div>
      {modal && <DataModal store={store} onClose={() => setModal(false)} onImport={doImport} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
